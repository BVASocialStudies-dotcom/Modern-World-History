<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Ottoman Debt Trap</title>
<style>
  :root{
    --green:#3B4B1F;
    --green-dark:#232D11;
    --black:#111111;
    --white:#FFFFFF;
    --red:#D2483C;
    --gold:#D9B36A;
    --off:#EFEFE7;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--green-dark);
    color:var(--white);
    font-family:var(--font);
    min-height:100vh;
  }
  .page{ max-width:900px; margin:0 auto; padding:26px 16px 60px; }

  .brandbar{ text-align:center; margin-bottom:14px; }
  .brandbar .eyebrow{
    font-size:11px; font-weight:800; letter-spacing:.2em; text-transform:uppercase;
    color:rgba(255,255,255,.55);
  }
  .brandbar h1{
    font-size:clamp(24px,4.4vw,34px); font-weight:900; letter-spacing:.01em; margin:6px 0 10px;
    color:var(--white); text-transform:uppercase;
  }
  .statbar{
    display:flex; justify-content:center; gap:22px; flex-wrap:wrap;
    font-size:12.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    color:rgba(255,255,255,.7);
  }
  .statbar b{ color:var(--white); }

  /* ---------- the slide card ---------- */
  .slide-card{
    background:var(--green);
    border:6px solid var(--black);
    border-radius:8px;
    box-shadow:0 24px 50px rgba(0,0,0,.55);
    padding:44px 48px 46px;
    margin-top:22px;
    position:relative;
    overflow:visible;
  }
  .slide-card.has-portraits{ padding-bottom:280px; }
  @media (max-width:640px){
    .slide-card{ padding:30px 22px 34px; }
    .slide-card.has-portraits{ padding-bottom:200px; }
  }

  .debt-chip{
    display:inline-block; background:var(--black); border-radius:6px;
    padding:8px 16px; margin:0 auto 20px; text-align:center;
  }
  .debt-chip-wrap{ text-align:center; }
  .debt-chip .lbl{ font-size:10.5px; font-weight:800; letter-spacing:.16em; color:rgba(255,255,255,.6); }
  .debt-chip .amt{ font-size:22px; font-weight:900; color:var(--red); letter-spacing:.02em; }

  .slide-title{
    font-size:clamp(22px,4.2vw,32px); font-weight:900; text-transform:uppercase;
    text-align:center; letter-spacing:.01em; margin:0 0 20px; color:var(--white);
  }
  .slide-body p{
    font-size:17px; line-height:1.55; color:var(--white); margin:0 0 16px; font-weight:500;
  }
  .prompt{
    text-align:center; font-size:clamp(17px,3vw,22px); font-weight:900; text-transform:uppercase;
    margin:26px 0 20px; color:var(--white);
  }

  .adlib-row{
    display:flex; justify-content:space-between; gap:18px; margin:18px 0 4px; position:relative; z-index:2;
  }
  .adlib{
    font-size:13.5px; font-style:italic; line-height:1.4; max-width:47%;
    color:rgba(255,255,255,.88);
  }
  .adlib .who{
    display:block; font-family:var(--font); font-style:normal; font-weight:800; font-size:10.5px;
    letter-spacing:.1em; text-transform:uppercase; color:var(--gold); margin-bottom:3px;
  }
  .adlib.banker-line{ text-align:left; }
  .adlib.vizier-line{ text-align:right; margin-left:auto; }
  .adlib.only{ max-width:70%; margin:0 auto; text-align:center; }

  .archival-photo{
    display:block; width:100%; max-width:520px; margin:18px auto 6px; border:4px solid var(--black);
    border-radius:2px; box-shadow:0 10px 24px rgba(0,0,0,.4);
  }
  .archival-caption{
    text-align:center; font-size:12px; color:rgba(255,255,255,.65); margin:0 0 18px; font-style:italic;
  }

  .options-row{
    display:flex; gap:20px; justify-content:center; flex-wrap:wrap; align-items:flex-start; position:relative; z-index:2;
  }
  .bubble{
    position:relative; background:var(--off); color:var(--black); cursor:pointer; text-align:center;
    max-width:270px; min-width:190px; padding:18px 20px; border:3px solid var(--black); border-radius:20px;
    box-shadow:0 8px 18px rgba(0,0,0,.35);
    transition:transform .08s ease, box-shadow .08s ease, background .15s ease;
    font-family:var(--font);
    margin-bottom:22px;
  }
  .bubble:hover{ background:#fff; transform:translateY(-2px); }
  .bubble:active{ transform:translateY(1px); box-shadow:0 3px 8px rgba(0,0,0,.3); }
  .bubble .opt-text{ font-size:17.5px; font-weight:800; color:var(--black); line-height:1.32; }
  .bubble::before, .bubble::after{
    content:""; position:absolute; top:100%; width:0; height:0; border-style:solid;
  }
  .bubble.tail-left::before{
    left:34px; border-width:16px 14px 0 0; border-color:var(--black) transparent transparent transparent;
  }
  .bubble.tail-left::after{
    left:37px; top:calc(100% - 3px); border-width:12px 11px 0 0; border-color:var(--off) transparent transparent transparent;
  }
  .bubble.tail-right::before{
    right:34px; border-width:16px 0 0 14px; border-color:var(--black) transparent transparent transparent;
  }
  .bubble.tail-right::after{
    right:37px; top:calc(100% - 3px); border-width:12px 0 0 11px; border-color:var(--off) transparent transparent transparent;
  }

  .continue-wrap{ text-align:center; margin-top:28px; position:relative; z-index:2; }
  .continue-btn{
    background:var(--black); color:var(--white); border:none; border-radius:6px;
    font-family:var(--font); font-weight:800; font-size:16px; letter-spacing:.04em; text-transform:uppercase;
    padding:14px 30px; cursor:pointer; transition:background .15s ease;
  }
  .continue-btn:hover{ background:#000; }

  /* ---------- bleeding cutout portraits ---------- */
  .portrait{
    position:absolute; bottom:-18px; height:330px; width:auto;
    filter:drop-shadow(0 16px 18px rgba(0,0,0,.5));
    pointer-events:none; z-index:1;
  }
  .portrait.sultan{ left:50%; transform:translateX(-50%); height:290px; z-index:2; }
  .portrait.banker{ left:2px; }
  .portrait.vizier{ right:2px; }
  /* when it's just the Sultan and the banker, shift the pair to the left together */
  .slide-card.duo-left .portrait.banker{ left:-4px; z-index:1; }
  .slide-card.duo-left .portrait.sultan{ left:230px; transform:none; z-index:2; }
  @media (max-width:640px){
    .portrait{ height:190px; }
    .portrait.sultan{ height:170px; }
    .portrait.banker{ left:-6px; }
    .portrait.vizier{ right:-6px; }
    .slide-card.duo-left .portrait.banker{ left:-8px; }
    .slide-card.duo-left .portrait.sultan{ left:130px; }
  }

  /* ---------- endings / summary ---------- */
  .ending-badge{
    display:inline-block; font-size:11.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
    padding:6px 14px; border-radius:20px; margin-bottom:16px; background:var(--black); color:var(--white);
  }
  .ending-badge.default{ background:var(--red); }
  hr.torn{ border:none; border-top:2px dashed rgba(255,255,255,.35); margin:26px 0; }
  .summary-table{ width:100%; border-collapse:collapse; margin:16px 0; font-size:14.5px; }
  .summary-table td{ padding:10px 4px; border-bottom:1px solid rgba(255,255,255,.2); }
  .summary-table td:last-child{ text-align:right; font-weight:800; }
  .quiet{ color:rgba(255,255,255,.65); font-size:13.5px; }
  .nation-input{
    font-family:var(--font); font-size:18px; font-weight:700; padding:12px 14px; width:100%;
    max-width:320px; border:none; border-radius:6px; margin:14px 0 6px; background:var(--off); color:var(--black);
  }
</style>
</head>

    <div class="eyebrow">Unit 3 &middot; A Choose-Your-Path Simulation</div>
    <h1>The Ottoman Debt Trap</h1>

      <span>Debt: <b id="statDebt">0 million</b></span>
    </div>
  </div>
  <div class="slide-card" id="stage"></div>
</div>

/* =========================================================
   RENDER HELPERS
========================================================= */
function portraitsHtml(sultan, banker, vizier){
  let h = '';
  if (banker) h += `<img class="portrait banker" src="${BANKER_IMG}" alt="George Bankington Loaningham VII">`;
  if (sultan) h += `<img class="portrait sultan" src="${SULTAN_IMG}" alt="The Ottoman Sultan">`;
  if (vizier) h += `<img class="portrait vizier" src="${VIZIER_IMG}" alt="The Grand Vizier">`;
  return h;
}

function debtChipHtml(debt){
  if (!debt) return '';
  return `<div class="debt-chip-wrap"><div class="debt-chip"><div class="lbl">Ottoman Debt Counter</div><div class="amt">${debt} million</div></div></div>`;
}

function adlibRowHtml(n){
  if (!n.bankerLine && !n.vizierLine) return '';
  if (n.bankerLine && n.vizierLine){
    return `<div class="adlib-row">
      <div class="adlib banker-line"><span class="who">The Banker</span>\u201c${n.bankerLine}\u201d</div>
      <div class="adlib vizier-line"><span class="who">The Vizier</span>\u201c${n.vizierLine}\u201d</div>
    </div>`;
  }
  const only = n.bankerLine
    ? `<span class="who">The Banker</span>\u201c${n.bankerLine}\u201d`
    : `<span class="who">The Vizier</span>\u201c${n.vizierLine}\u201d`;
  return `<div class="adlib-row"><div class="adlib only">${only}</div></div>`;
}

function drawNode(id){
  const n = NODES[id];
  state.debt = n.debt;
  state.decisions += 1;
  updateStatbar(n.year);

  const hasPortraits = n.sultan || n.banker || n.vizier;
  const isChoice = n.choices.length > 1;

  let bodyHtml;
  if (isChoice){
    // loan-bearing choices sit on the left (banker's side); the other choice sits on the right (vizier's side)
    let displayChoices = n.choices.slice();
    displayChoices.sort((a,b) => (a.loan?0:1) - (b.loan?0:1));
    const optsHtml = displayChoices.map((c)=>{
      const tailClass = c.loan ? 'tail-left' : 'tail-right';
      return `<button class="bubble ${tailClass}" onclick="go('${c.next}')">
        <span class="opt-text">${c.label}${c.sub ? '<br>'+c.sub : ''}</span>
      </button>`;
    }).join('');
    const adlibHtml = adlibRowHtml(n);
    bodyHtml = `
      ${debtChipHtml(n.debt)}
      <h2 class="slide-title">${n.title}</h2>
      ${n.text.map(p=>`<p>${p}</p>`).join('')}
      ${adlibHtml}
      <div class="prompt">What should we do?</div>
      <div class="options-row">${optsHtml}</div>
    `;
  } else {
    bodyHtml = `
      ${debtChipHtml(n.debt)}
      <h2 class="slide-title">${n.title}</h2>
      ${n.text.map(p=>`<p>${p}</p>`).join('')}
      <div class="continue-wrap"><button class="continue-btn" onclick="go('${n.choices[0].next}')">${n.choices[0].label}</button></div>
    `;
  }

  stage(`
    <div class="slide-body">${bodyHtml}</div>
    ${portraitsHtml(n.sultan, n.banker, n.vizier)}
  `);
  document.getElementById('stage').classList.toggle('has-portraits', !!hasPortraits);
  document.getElementById('stage').classList.toggle('duo-left', !!(n.sultan && n.banker && !n.vizier));
}

function drawEnding(id){
  const e = ENDINGS[id];
  state.debt = e.debt;
  state.decisions += 1;
  state.endingLabel = e.label;
  state.endingKind = e.kind;
  updateStatbar('Epilogue');

  const hasPortraits = e.sultan || e.banker || e.vizier;
  const badgeClass = e.kind==='default' ? 'default' : '';

  stage(`
    <div class="slide-body">
      <div class="ending-badge ${badgeClass}">${e.kind==='default' ? 'Default Ending' : 'Alternate Path'}</div>
      ${debtChipHtml(e.debt)}
      <h2 class="slide-title">${e.label}</h2>
      ${e.text.map(p=>`<p>${p}</p>`).join('')}
      <p class="quiet">This is not what actually happened to the Ottoman Empire. History took the other road.</p>
      <div class="continue-wrap"><button class="continue-btn" onclick="showFinalSummary()">End the Chronicle Here</button></div>
    </div>
    ${portraitsHtml(e.sultan, e.banker, e.vizier)}
  `);
  document.getElementById('stage').classList.toggle('has-portraits', !!hasPortraits);
  document.getElementById('stage').classList.toggle('duo-left', !!(e.sultan && e.banker && !e.vizier));
}

function go(next){
  if (next==='FINAL'){ showFinalSummary(); return; }
  if (NODES[next]) { drawNode(next); return; }
  if (ENDINGS[next]) { drawEnding(next); return; }
}

function showFinalSummary(){
  updateStatbar('Epilogue');
  const historical = state.debt===127 && !state.endingLabel;
  document.getElementById('stage').classList.remove('has-portraits');
  stage(`
    <div class="slide-body">
      <h2 class="slide-title">The Chronicle Ends</h2>
      <table class="summary-table">
        <tr><td>Ending reached</td><td>${state.endingLabel || (historical ? 'The Ottoman Public Debt Administration' : 'Historical path')}</td></tr>
        <tr><td>Final imperial debt</td><td>${state.debt} million</td></tr>
        <tr><td>Decisions made</td><td>${state.decisions}</td></tr>
      </table>
      ${historical ? `<p>You followed the same road the real Ottoman government walked between 1854 and the 1880s: each individual loan looked reasonable at the time, but the interest compounded faster than the empire could ever repay it. By the end, foreign bankers — not the Sultan — decided how Ottoman tax revenue was spent.</p>
      <p><strong>Next up:</strong> the OPDA is only the beginning of foreign financial control in the region — next, we'll look at the Ottomans, Egypt, and the Suez Canal.</p>` : `<p>Your chronicle ended before the full historical spiral — a reminder that at almost every one of these decision points, a less indebted road was available. It usually meant slower growth, angrier provinces, or a smaller empire. History's Ottoman government kept choosing the loan.</p>`}
      <div class="continue-wrap"><button class="continue-btn" onclick="restart()">Start Over</button></div>
    </div>
  `);
}

function restart(){
  state.debt = 0; state.decisions = 0; state.endingLabel = null; state.endingKind = null;
  drawNode('n1_start');
}

/* =========================================================
   INIT
========================================================= */
drawNode('n1_start');
</script>
