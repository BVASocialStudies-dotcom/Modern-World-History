<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="An interactive timeline of Hitler’s rise to power and early rule, 1919 to 1936. Students identify the characteristics of fascism from Jason Stanley’s How Fascism Works at each step.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;family=Old+Standard+TT:wght@400;700&amp;display=swap" rel="stylesheet">
<title>Hitler’s Rise to Power: A Fascism Timeline</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E4ECF6; --surface:#F8FAFD; --ink:#0F1F3A; --muted:#475A78; --line:#B8C7DC;
  --soft:#D3E0F1; --accent:#1F4E8C; --accent-ink:#FFFFFF;
  --hdr-bg:#12264A; --hdr-ink:#F3F6FB; --hdr-muted:#B7C6DF; --hdr-rule:#8FB0DD;
  --good:#1E7A4C; --miss:#A65A00; --bad:#8C2F3A;
  --c-hier:#7A3E9D; --c-myth:#9A6A0B; --c-anti:#2B6CB0; --c-vict:#B4491A;
  --c-law:#2A7A55; --c-sex:#B0307A; --c-sod:#1F8A8A; --c-work:#7A5230;
  --serif:"EB Garamond",Garamond,"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --display:"Old Standard TT","Libre Baskerville","Baskerville Old Face",Baskerville,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1424; --surface:#111F38; --ink:#E6EEF9; --muted:#9DB0CC; --line:#2A3D5E;
    --soft:#182A47; --accent:#7FB2F0; --accent-ink:#0A1A30;
    --hdr-bg:#0D1B34; --hdr-ink:#F3F6FB; --hdr-muted:#9DB0CC; --hdr-rule:#4C74AE;
    --good:#5CCB92; --miss:#F0A44A; --bad:#F08A96;
    --c-hier:#C39BE0; --c-myth:#E0B25A; --c-anti:#7FB2EE; --c-vict:#F0946A;
    --c-law:#6FCB9E; --c-sex:#EE8FC1; --c-sod:#5FD0D0; --c-work:#C9A07A;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1424; --surface:#111F38; --ink:#E6EEF9; --muted:#9DB0CC; --line:#2A3D5E;
  --soft:#182A47; --accent:#7FB2F0; --accent-ink:#0A1A30;
    --hdr-bg:#0D1B34; --hdr-ink:#F3F6FB; --hdr-muted:#9DB0CC; --hdr-rule:#4C74AE;
  --good:#5CCB92; --miss:#F0A44A; --bad:#F08A96;
  --c-hier:#C39BE0; --c-myth:#E0B25A; --c-anti:#7FB2EE; --c-vict:#F0946A;
  --c-law:#6FCB9E; --c-sex:#EE8FC1; --c-sod:#5FD0D0; --c-work:#C9A07A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:border-box;}
[hidden]{display:none !important;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;}
button,textarea,input{font:inherit;color:inherit;}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

/* header */
.top{padding:1.25rem clamp(1rem,3vw,2rem) 1.1rem;background:var(--hdr-bg);color:var(--hdr-ink);border-bottom:5px double var(--hdr-rule);}
.top-inner{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:1rem;align-items:flex-end;justify-content:space-between;}
.top h1{margin:0;font-weight:700;font-family:var(--display);font-size:clamp(1.6rem,4vw,2.4rem);line-height:1.1;letter-spacing:-.01em;}
.sub{margin:.35rem 0 0;color:var(--hdr-muted);max-width:52ch;font-family:var(--serif);font-size:1.15rem;}
.top-tools{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;}
.progress{font-size:.9rem;color:var(--hdr-muted);}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:.55rem .95rem;cursor:pointer;font-weight:600;font-size:.92rem;}
.btn:hover{border-color:var(--accent);}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.btn.primary:disabled{opacity:.45;cursor:not-allowed;}
.btn.ghost{background:transparent;}
.top .btn.ghost{color:var(--hdr-ink);border-color:var(--hdr-rule);}
.top .btn.ghost:hover{background:rgba(255,255,255,.08);}
.toolkit{max-width:1180px;margin:1rem auto 0;}

/* toolkit list */
.tk-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.6rem;}
.tk-list li{color:var(--ink);background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:6px;padding:.55rem .75rem;}
.tk-list strong{display:block;font-size:.95rem;}
.tk-list span{color:var(--muted);font-size:.86rem;}

/* layout */
.layout{max-width:1180px;margin:0 auto;padding:1.25rem clamp(1rem,3vw,2rem) 3rem;display:grid;grid-template-columns:250px minmax(0,1fr);gap:1.5rem;align-items:start;}
.rail{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding-right:.25rem;}
.rail-part{font-size:.82rem;font-weight:700;color:var(--muted);margin:1rem 0 .35rem;padding-left:1.6rem;}
.rail-part:first-child{margin-top:0;}
.rail-item{position:relative;display:flex;gap:.6rem;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:.4rem .5rem .4rem 0;cursor:pointer;border-radius:6px;}
.rail-item::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--line);}
.rail-item .node{position:relative;z-index:1;flex:none;width:18px;height:18px;margin-top:.15rem;border-radius:50%;background:var(--bg);border:2px solid var(--muted);}
.rail-item.done .node{background:var(--good);border-color:var(--good);}
.rail-item.current .node{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent);}
.rail-item.current.done .node{border-color:var(--accent);}
.rail-text{display:flex;flex-direction:column;line-height:1.25;}
.rail-year{font-family:var(--display);font-weight:700;font-size:1.05rem;}
.rail-title{font-size:.86rem;color:var(--muted);}
.rail-item.current .rail-title{color:var(--ink);font-weight:600;}
.rail-item.current{background:var(--soft);}
.rail-results{margin-top:1rem;width:100%;}

/* stage */
.stage{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:clamp(1rem,3vw,2.25rem);min-width:0;}
.stage:focus{outline:none;}
.ev-head{display:flex;flex-wrap:wrap;gap:1rem 1.5rem;align-items:flex-end;margin-bottom:1.25rem;}
.ev-year{font-family:var(--display);font-weight:700;font-size:clamp(3.25rem,10vw,6.5rem);line-height:.9;letter-spacing:-.03em;border-top:6px solid var(--accent);padding-top:.4rem;font-variant-numeric:lining-nums;}
.ev-date{margin:0;color:var(--muted);font-size:.92rem;}
.ev-title{margin:.1rem 0 0;font-family:var(--display);font-size:clamp(1.35rem,3.2vw,2rem);line-height:1.15;}
.ev-title:focus{outline:none;}
.story p{font-family:var(--serif);font-size:1.28rem;line-height:1.6;max-width:66ch;margin:0 0 1rem;}
.ev-fig{float:right;width:min(46%,400px);margin:.25rem 0 1rem 1.5rem;}
.ev-fig img{display:block;width:100%;height:auto;border:1px solid var(--line);background:var(--soft);}
.ev-fig figcaption{font-size:.82rem;color:var(--muted);margin-top:.35rem;line-height:1.35;}
.ev-fig.portrait{width:min(34%,290px);}
.evidence{clear:both;}
.evidence{margin:1.5rem 0;padding:1rem 1.15rem;background:var(--soft);border-radius:6px;}
.evidence h3,.quiz h3,.feedback h3{margin:0 0 .5rem;font-size:1rem;}
.evidence ul{margin:0;padding-left:1.1rem;max-width:70ch;}
.evidence li{margin:.35rem 0;font-size:.95rem;}
.quiz{margin-top:1.75rem;}
.hint{margin:0 0 .85rem;color:var(--muted);font-size:.92rem;}

/* chips */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:.6rem;}
.chip{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--c);border-radius:6px;padding:.6rem .8rem .6rem .85rem;cursor:pointer;display:flex;flex-direction:column;gap:.15rem;min-height:5.2rem;}
.chip:hover{border-color:var(--c);}
.chip-name{font-weight:700;font-size:.98rem;}
.chip-def{font-size:.84rem;color:var(--muted);line-height:1.35;}
.chip-state{font-size:.8rem;font-weight:700;min-height:1.1em;}
.chip.on{background:color-mix(in srgb,var(--c) 16%,var(--surface));border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);}
.chip.on .chip-state{color:var(--ink);}
.chip[aria-disabled="true"]{cursor:default;}
.chip.hit .chip-state{color:var(--good);}
.chip.miss{border-style:dashed;}
.chip.miss .chip-state{color:var(--miss);}
.chip.also .chip-state{color:var(--accent);}
.chip.wrong .chip-state{color:var(--bad);}
.chip.dim{opacity:.55;}

.ev-note{margin-top:1.1rem;}
.ev-note label{display:block;font-weight:600;font-size:.92rem;margin-bottom:.3rem;}
textarea,input[type="text"]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.6rem .75rem;resize:vertical;}
.actions{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem;align-items:center;}

/* feedback */
.feedback{margin-top:1.5rem;padding:1.1rem 1.15rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);}
.feedback:focus{outline:none;}
.fb-item{border-left:6px solid var(--c);background:var(--surface);border-radius:4px;padding:.6rem .85rem;margin:.6rem 0;}
.fb-item p{margin:.2rem 0 0;font-size:.95rem;max-width:70ch;}
.fb-name{font-weight:700;}
.fb-tag{font-size:.82rem;font-weight:700;margin-left:.5rem;}
.fb-item.hit .fb-tag{color:var(--good);}
.fb-item.miss .fb-tag{color:var(--miss);}
.fb-item.also .fb-tag{color:var(--accent);}
.fb-item.wrong .fb-tag{color:var(--bad);}
.nav-row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.6rem;margin-top:1.75rem;padding-top:1rem;border-top:1px solid var(--line);}

/* intro + results */
.card-title{font-family:var(--display);font-size:clamp(1.5rem,3.5vw,2.1rem);margin:0 0 .75rem;line-height:1.15;}
.card-title:focus{outline:none;}
.steps{max-width:66ch;padding-left:1.25rem;font-size:1.02rem;}
.steps li{margin:.5rem 0;}
.section-h{font-family:var(--display);font-size:1.25rem;margin:2rem 0 .6rem;}
.matrix-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;}
.matrix{border-collapse:collapse;width:100%;font-size:.88rem;background:var(--surface);}
.matrix th,.matrix td{border-bottom:1px solid var(--line);padding:.35rem .3rem;text-align:center;}
.matrix th.rowh{text-align:left;position:sticky;left:0;background:var(--surface);min-width:12rem;font-weight:600;padding-left:.75rem;}
.matrix thead th{vertical-align:bottom;height:10.5rem;background:var(--surface);}
.colhead{display:flex;flex-direction:column;align-items:center;gap:.4rem;}
.vlabel{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;font-weight:600;}
.cdot{width:12px;height:12px;border-radius:50%;background:var(--c);}
.matrix td{font-weight:800;font-size:1rem;}
.matrix td.hit{color:var(--good);}
.matrix td.miss{color:var(--miss);}
.matrix td.also{color:var(--accent);}
.matrix td.wrong{color:var(--bad);}
.matrix tr.todo th.rowh{color:var(--muted);font-weight:400;}
.matrix tfoot th,.matrix tfoot td{font-weight:600;font-size:.88rem;background:var(--soft);}
.matrix tfoot th{text-align:left;padding-left:.75rem;position:sticky;left:0;}
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1.25rem;margin:.6rem 0 0;font-size:.88rem;color:var(--muted);}
.legend b{font-size:1rem;}
.score-line{font-size:1.05rem;}
.notes-list{list-style:none;margin:0;padding:0;}
.notes-list li{border-top:1px solid var(--line);padding:.7rem 0;}
.notes-list strong{font-family:var(--display);}
.tag-row{display:flex;flex-wrap:wrap;gap:.35rem;margin:.3rem 0;}
.tag{font-size:.8rem;border:1px solid var(--line);border-left:6px solid var(--c);border-radius:4px;padding:.1rem .45rem;background:var(--bg);}
.reflect label{display:block;font-weight:600;margin:1rem 0 .3rem;max-width:70ch;}
.name-row{max-width:26rem;margin:.75rem 0;}
.name-row label{display:block;font-weight:600;font-size:.92rem;margin-bottom:.25rem;}
.copy-box{margin-top:.75rem;}
.copy-box textarea{min-height:9rem;font-size:.85rem;}
.after{margin-top:2rem;padding:1rem 1.15rem;background:var(--soft);border-radius:6px;max-width:72ch;}
.after p{margin:.4rem 0;}
.print-only{display:none;}

@media (max-width:700px){
  .ev-fig{float:none;width:100%;max-width:420px;margin:0 0 1rem;}
  .ev-fig.portrait{width:100%;max-width:320px;}
}
@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr);}
  .rail{position:static;max-height:none;display:flex;gap:.25rem;overflow-x:auto;padding-bottom:.5rem;}
  .rail-part{display:none;}
  .rail-item{flex:none;width:auto;min-width:6.5rem;flex-direction:column;align-items:flex-start;gap:.25rem;padding:.4rem .6rem;border:1px solid var(--line);background:var(--surface);}
  .rail-item::before{display:none;}
  .rail-item .node{width:12px;height:12px;margin:0;}
  .rail-title{display:none;}
  .rail-results{margin-top:0;width:auto;flex:none;}
}
@media (prefers-reduced-motion:no-preference){
  .chip,.btn{transition:background-color .12s,border-color .12s;}
}
@media print{
  :root,:root:not([data-theme="light"]),:root[data-theme="dark"]{
    padding:0;--bg:#fff;--surface:#fff;--ink:#000;--muted:#333;--line:#999;--soft:#eee;--accent:#1F4E8C;--hdr-bg:#fff;--hdr-ink:#000;--hdr-muted:#333;--hdr-rule:#999;
    --good:#1E7A4C;--miss:#A65A00;--bad:#8C2F3A;
    --c-hier:#7A3E9D;--c-myth:#9A6A0B;--c-anti:#2B6CB0;--c-vict:#B4491A;--c-law:#2A7A55;--c-sex:#B0307A;--c-sod:#1F8A8A;--c-work:#7A5230;
  }
  body{background:#fff;color:#000;}
  .top-tools,.toolkit,.rail,.nav-row,.no-print,.btn,.copy-box{display:none !important;}
  .print-only{display:block;}
  .top{border:0;padding:0 0 .5rem;background:#fff;color:#000;}
  .layout{display:block;padding:0;}
  .stage{border:0;padding:0;}
  .matrix th.rowh,.matrix tfoot th{position:static;}
  .matrix-wrap{overflow:visible;}
  textarea{border:0;padding:0;}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div>
      <h1>Hitler’s Rise to Power</h1>
      <p class="sub">A timeline from 1919 to 1936. At every step, name the tools of fascism Hitler is using.</p>
    </div>
    <div class="top-tools">
      <div class="progress" id="progress" aria-live="polite"></div>
      <button type="button" class="btn ghost" id="toolkitBtn" aria-expanded="false" aria-controls="toolkit">Show the eight characteristics</button>
    </div>
  </div>
  <section id="toolkit" class="toolkit" aria-label="The eight characteristics of fascism" hidden></section>
</header>
<div class="layout">
  <nav id="rail" class="rail" aria-label="Timeline of events"></nav>
  <main id="stage" class="stage" tabindex="-1"></main>
</div>

<script>
(function(){
"use strict";

/* ---------- DATA ---------- */

var CHARS = [
  {id:"hier", name:"Hierarchy", css:"--c-hier", def:"Some groups are born to rule and others to obey, with one supreme leader on top."},
  {id:"myth", name:"The Mythic Past", css:"--c-myth", def:"A pure, glorious national past that was lost and must be brought back."},
  {id:"anti", name:"Anti-Intellectualism", css:"--c-anti", def:"Attacks on schools, experts, and the press, so people trust the leader instead of facts."},
  {id:"vict", name:"Victimhood", css:"--c-vict", def:"The dominant nation is the real victim of enemies, elites, and minorities."},
  {id:"law", name:"Law & Order", css:"--c-law", def:"Outsiders are painted as criminals, while the leader promises order and excuses his own side’s violence."},
  {id:"sex", name:"Sexual Anxiety", css:"--c-sex", def:"Panic about threats to family and purity: race mixing, homosexuality, changing gender roles."},
  {id:"sod", name:"Sodom & Gomorrah", css:"--c-sod", def:"Big cities and modern culture are painted as immoral and decadent; rural life is pure."},
  {id:"work", name:"Work Sets You Free", css:"--c-work", def:"Hard work for the nation is glorified, and people called “lazy” or “parasites” are targeted."}
];
var CHAR_BY_ID = {};
CHARS.forEach(function(c){ CHAR_BY_ID[c.id] = c; });

var PARTS = {1:"Part 1: The rise (1919 to Jan. 1933)", 2:"Part 2: Taking control (1933 to 1936)"};

var EVENTS = [
{
  id:"versailles", part:1, year:"1919", short:"Treaty of Versailles", date:"June 28, 1919",
  title:"Germany signs the Treaty of Versailles",
  story:[
    "Germany lost World War I. In November 1918, civilian politicians signed the armistice that ended the fighting. Seven months later, Germany was forced to sign the Treaty of Versailles. It had to accept blame for the war, pay enormous reparations, give up territory, and shrink its army to 100,000 men.",
    "Many Germans were stunned. German troops were still on foreign soil when the war ended, and the public had heard little about how badly the war was going. Right-wing officers and politicians began spreading a story called the “stab-in-the-back legend”: the army was never truly beaten, they said, but was betrayed at home by socialists, politicians, and Jews. A young army veteran in Munich named Adolf Hitler would build his political career on this story."
  ],
  evidence:[
    "The treaty’s “war guilt” clause blamed Germany alone for the war.",
    "Politicians who signed the armistice were nicknamed the “November criminals.”",
    "The stab-in-the-back legend claimed the army had been betrayed, even though top generals had told the government the war could not be won."
  ],
  core:["vict","myth"], also:["hier"],
  why:{
    vict:"Germany is cast as the innocent victim of a cruel treaty, of foreign enemies, and of traitors at home. Victimhood turns national anger into a search for people to blame.",
    myth:"The legend protects the image of a great, undefeated German army. The reality of a lost war is swapped for a myth of past glory that was “stolen.”",
    hier:"The legend sorts Germans into loyal “true Germans” and “traitors” (socialists, Jews). That is the first step toward ranking people by whether they belong."
  }
},
{
  id:"party", part:1, year:"1920", short:"Hitler takes over a tiny party", date:"September 1919 to July 1921",
  title:"A tiny party finds its leader",
  story:[
    "In September 1919, Hitler attended a meeting of the small German Workers’ Party in Munich. The army had actually sent him to spy on it. Instead he joined, and quickly became its best speaker. In February 1920 the party renamed itself the National Socialist German Workers’ Party, or Nazi Party, and announced a 25-point program.",
    "The program demanded an end to the Versailles treaty and a union of all German-speaking people. It also declared that only people of “German blood” could be citizens, and that no Jew could be. In July 1921, Hitler forced his way to the top and demanded total control. The party adopted the “leader principle”: the Führer decides, and everyone else obeys. Around the same time the party formed the SA, uniformed men who guarded Nazi meetings and attacked opponents."
  ],
  evidence:[
    "Point 4 of the program: only people of “German blood” may be citizens, and no Jew may be a citizen.",
    "The program demanded the cancellation of the Versailles treaty.",
    "In 1921, Hitler won dictatorial control of the party; members were expected to obey the Führer.",
    "The SA broke up rival meetings and beat political opponents."
  ],
  core:["hier","vict"], also:["law","myth"],
  why:{
    hier:"Two hierarchies at once: a racial one (citizenship only for “German blood”) and a political one (a single Führer with total control over the party).",
    vict:"The program reads like a list of grievances: Germany as the victim of Versailles, and of Jews and others said not to belong in the nation.",
    law:"The SA claimed to protect meetings and “order” from the left while using violence themselves. The Nazis would lean on this theme harder later.",
    myth:"The call to unite all Germans in a single “Greater Germany” draws on a dream of a lost, united national greatness."
  }
},
{
  id:"putsch", part:1, year:"1923", short:"Beer Hall Putsch", date:"November 8–9, 1923",
  title:"The Beer Hall Putsch",
  story:[
    "By 1923 Germany was in crisis. French troops had occupied the industrial Ruhr region, and hyperinflation had wiped out savings; a loaf of bread cost hundreds of billions of marks. Inspired by Mussolini’s “March on Rome” in Italy, Hitler decided to seize power. On the night of November 8, he burst into a Munich beer hall with armed followers and announced a “national revolution.” The next day about 2,000 Nazis marched toward the city center, where police opened fire. Sixteen Nazis and four police officers were killed.",
    "Hitler was arrested and tried for treason. But the judges sympathized with him. He used the courtroom as a stage, speaking for hours about betrayal by the “November criminals” and posing as a patriot. Newspapers across Germany printed his speeches. He was sentenced to five years, and was released after only about nine months in prison."
  ],
  evidence:[
    "Hitler tried to overthrow an elected government by force, an act of treason.",
    "General Erich Ludendorff, a famous World War I commander, marched with the Nazis to lend the plot respectability.",
    "At his trial, Hitler called the leaders of the republic traitors and himself a patriot.",
    "His sentence was far lighter than the law allowed."
  ],
  core:["vict","myth"], also:["law"],
  why:{
    vict:"Hitler flipped the script. He tried to seize power by force, yet told Germans that he, the patriot, was being persecuted by the traitors running the country.",
    myth:"The plot borrowed the glory of the old army (Ludendorff) and promised a “march on Berlin” to restore a great Germany. The Nazis killed in the attempt were later honored as martyrs.",
    law:"A double standard: a man who tried to overthrow the government got leniency, while he claimed the republic itself was criminal. Fascist “law and order” language usually applies to “them,” not “us.”"
  }
},
{
  id:"kampf", part:1, year:"1925", short:"Prison and Mein Kampf", date:"1924 to 1926",

var REFLECT_Q = [
  "Which characteristic of fascism do you think helped Hitler most in gaining and keeping power? Use evidence from at least two events.",
  "Many of these steps were legal, or were made to look legal. How does that change the way you think about how a democracy can be lost?",
  "Choose one characteristic. What could ordinary citizens, teachers, judges, or newspapers have done at the time to resist it?"
];

/* ---------- STATE ---------- */

var STORE_KEY = "hitler-timeline-v1";
function fresh(){ return {view:"intro", i:0, answers:{}, name:"", reflect:["","",""]}; }
function load(){
  try{
    var s = sessionStorage.getItem(STORE_KEY);
    if(!s) return null;
    var o = JSON.parse(s);
    if(o && o.answers && typeof o.answers === "object" && o.reflect && o.reflect.length === 3) return o;
  }catch(e){}
  return null;
}
function save(){ try{ sessionStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }
var state = load() || fresh();

/* ---------- HELPERS ---------- */

function $(id){ return document.getElementById(id); }
function el(tag, cls, text){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined && text !== null) e.textContent = text;
  return e;
}
function plural(n, s, p){ return n + " " + (n === 1 ? s : (p || s + "s")); }
function getAns(id){
  if(!state.answers[id]) state.answers[id] = {sel:[], ev:"", done:false};
  return state.answers[id];
}
function colorOf(c){ return "var(" + c.css + ")"; }
function scoreEvent(ev){
  var a = getAns(ev.id), hits = 0, wrong = 0;
  a.sel.forEach(function(c){
    if(ev.core.indexOf(c) > -1) hits++;
    else if(ev.also.indexOf(c) === -1) wrong++;
  });
  return {hits:hits, wrong:wrong, pts:Math.max(0, hits - wrong)};
}
function totals(){
  var t = {done:0, pts:0, possible:0};
  EVENTS.forEach(function(ev){
    t.possible += ev.core.length;
    if(getAns(ev.id).done){ t.done++; t.pts += scoreEvent(ev).pts; }
  });
  return t;
}
function go(view, idx){
  state.view = view;
  if(idx !== undefined) state.i = idx;
  save();
  render();
  window.scrollTo(0, 0);
  var f = view === "event" ? $("evTitle") : $("cardTitle");
  if(f){ try{ f.focus({preventScroll:true}); }catch(e){} }
}

/* ---------- SHARED PIECES ---------- */

function buildToolkitList(){
  var ul = el("ul", "tk-list");
  CHARS.forEach(function(c){
    var li = el("li");
    li.style.setProperty("--c", colorOf(c));
    li.appendChild(el("strong", null, c.name));
    li.appendChild(el("span", null, c.def));
    ul.appendChild(li);
  });
  return ul;
}

/* ---------- RENDER: HEADER + RAIL ---------- */

function renderProgress(){
  var t = totals();
  $("progress").textContent = t.done + " of " + EVENTS.length + " events checked. Score: " + t.pts + " / " + t.possible;
}

function renderRail(){
  var rail = $("rail");
  rail.innerHTML = "";
  var lastPart = 0;
  EVENTS.forEach(function(ev, idx){
    if(ev.part !== lastPart){
      lastPart = ev.part;
      rail.appendChild(el("div", "rail-part", PARTS[ev.part]));
    }
    var b = el("button", "rail-item");
    b.type = "button";
    var a = getAns(ev.id);
    if(a.done) b.classList.add("done");
    if(state.view === "event" && state.i === idx){
      b.classList.add("current");
      b.setAttribute("aria-current", "step");
    }
    b.appendChild(el("span", "node"));
    var t = el("span", "rail-text");
    t.appendChild(el("span", "rail-year", ev.year));
    t.appendChild(el("span", "rail-title", ev.short));
    b.appendChild(t);
    var label = ev.year + ": " + ev.short + (a.done ? " (checked)" : "");
    b.setAttribute("aria-label", label);
    b.addEventListener("click", function(){ go("event", idx); });
    rail.appendChild(b);
  });
  var r = el("button", "btn rail-results", "My results");
  r.type = "button";
  if(state.view === "results") r.classList.add("primary");
  r.addEventListener("click", function(){ go("results"); });
  rail.appendChild(r);
}

/* ---------- RENDER: INTRO ---------- */

function buildIntro(){
  var wrap = el("div", "intro");
  var h = el("h2", "card-title", "Before you begin");
  h.id = "cardTitle"; h.tabIndex = -1;
  wrap.appendChild(h);
  wrap.appendChild(el("p", "story-lead", "Hitler did not take power all at once. He did it in steps, and at almost every step he used the same set of tools you studied in How Fascism Works. Your job is to spot them."));
  var ol = el("ol", "steps");
  ol.appendChild(el("li", null, "Read what happened and study the evidence box."));
  ol.appendChild(el("li", null, "Select every characteristic of fascism you can support with that evidence, then check your answer."));
  ol.appendChild(el("li", null, "Read the explanations. Each event has two to three strong matches, and a few more that are also present. A wrong pick cancels out one point, so choose with evidence, not guesses."));
  wrap.appendChild(ol);
  wrap.appendChild(el("h3", "section-h", "The eight characteristics"));
  wrap.appendChild(el("p", "hint", "These come from Jason Stanley’s book How Fascism Works. You can reopen this list at any time with the button at the top of the page."));
  wrap.appendChild(buildToolkitList());
  wrap.appendChild(el("p", "hint", "Your answers are saved only in this browser tab. When you finish, open My results to print or copy them."));
  var act = el("div", "actions");
  var b = el("button", "btn primary", "Begin with 1919");
  b.type = "button";
  b.addEventListener("click", function(){ go("event", 0); });
  act.appendChild(b);
  wrap.appendChild(act);
  return wrap;
}

/* ---------- RENDER: EVENT ---------- */

function paintChip(b, cid, ev, a){
  var sel = a.sel.indexOf(cid) > -1;
  var st = b.querySelector(".chip-state");
  b.classList.toggle("on", sel);
  b.setAttribute("aria-pressed", sel ? "true" : "false");
  if(!a.done){ st.textContent = sel ? "Selected" : ""; return; }
  var isCore = ev.core.indexOf(cid) > -1, isAlso = ev.also.indexOf(cid) > -1;
  b.setAttribute("aria-disabled", "true");
  b.classList.remove("hit","miss","also","wrong","dim");
  if(isCore && sel){ b.classList.add("hit"); st.textContent = "Found it"; }
  else if(isCore){ b.classList.add("miss"); st.textContent = "Missed"; }
  else if(isAlso){ b.classList.add("also"); st.textContent = sel ? "Also present (good catch)" : "Also present"; }
  else if(sel){ b.classList.add("wrong"); st.textContent = "Not a strong fit here"; }
  else { b.classList.add("dim"); st.textContent = ""; }
}

function fbItem(cid, kind, tag, text){
  var c = CHAR_BY_ID[cid];
  var d = el("div", "fb-item " + kind);
  d.style.setProperty("--c", colorOf(c));
  var top = el("div");
  top.appendChild(el("span", "fb-name", c.name));
  top.appendChild(el("span", "fb-tag", tag));
  d.appendChild(top);
  d.appendChild(el("p", null, text));
  return d;
}

function buildFeedback(ev, a){
  var box = el("section", "feedback");
  box.id = "feedback"; box.tabIndex = -1;
  box.setAttribute("aria-live", "polite");
  var r = scoreEvent(ev);
  var msg = "You found " + r.hits + " of " + plural(ev.core.length, "strong match", "strong matches") + ".";
  if(r.wrong > 0) msg += " " + plural(r.wrong, "pick") + (r.wrong === 1 ? " didn’t" : " didn’t") + " fit this event.";
  box.appendChild(el("h3", null, msg));
  ev.core.forEach(function(cid){
    var hit = a.sel.indexOf(cid) > -1;
    box.appendChild(fbItem(cid, hit ? "hit" : "miss", hit ? "Found it" : "You missed this one", ev.why[cid]));
  });
  ev.also.forEach(function(cid){
    box.appendChild(fbItem(cid, "also", "Also present", ev.why[cid]));
  });
  a.sel.forEach(function(cid){
    if(ev.core.indexOf(cid) === -1 && ev.also.indexOf(cid) === -1){
      var c = CHAR_BY_ID[cid];
      box.appendChild(fbItem(cid, "wrong", "Not a strong fit here",
        "Nothing in this event’s evidence clearly points to this one. Compare its definition (" + c.def + ") with the details above."));
    }
  });
  return box;
}

function buildEvent(idx){
  var ev = EVENTS[idx], a = getAns(ev.id);
  var art = el("article", "event");

  var head = el("header", "ev-head");
  head.appendChild(el("div", "ev-year", ev.year));
  var meta = el("div", "ev-meta");
  meta.appendChild(el("p", "ev-date", ev.date));
  var h = el("h2", "ev-title", ev.title);
  h.id = "evTitle"; h.tabIndex = -1;
  meta.appendChild(h);
  head.appendChild(meta);
  art.appendChild(head);

  var story = el("div", "story");
  var im = IMAGES[ev.id];
  if(im){
    var fig = el("figure", "ev-fig" + (im.portrait ? " portrait" : ""));
    var img = el("img");
    img.src = im.src; img.alt = im.alt || ""; img.loading = "lazy";
    fig.appendChild(img);
    var cap = el("figcaption", null, im.caption || "");
    if(im.credit){ cap.appendChild(document.createTextNode(" Source: " + im.credit)); }
    if(im.caption || im.credit) fig.appendChild(cap);
    story.appendChild(fig);
  }
  ev.story.forEach(function(p){ story.appendChild(el("p", null, p)); });
  art.appendChild(story);

  var evd = el("section", "evidence");
  evd.appendChild(el("h3", null, "Evidence to notice"));
  var ul = el("ul");
  ev.evidence.forEach(function(t){ ul.appendChild(el("li", null, t)); });
  evd.appendChild(ul);
  art.appendChild(evd);

  var quiz = el("section", "quiz");
  quiz.appendChild(el("h3", null, "Which characteristics of fascism does Hitler use here?"));
  quiz.appendChild(el("p", "hint", a.done ? "Your answer is locked in. Read the feedback below." : "Select every one you can support with the evidence above. A wrong pick cancels one point."));

  var chk = el("button", "btn primary", "Check my answer");
  chk.type = "button";
  chk.disabled = a.done || a.sel.length === 0;

  var grid = el("div", "chips");
  grid.setAttribute("role", "group");
  grid.setAttribute("aria-label", "Characteristics of fascism");
  CHARS.forEach(function(c){
    var b = el("button", "chip");
    b.type = "button";
    b.style.setProperty("--c", colorOf(c));
    b.appendChild(el("span", "chip-name", c.name));
    b.appendChild(el("span", "chip-def", c.def));
    b.appendChild(el("span", "chip-state"));
    paintChip(b, c.id, ev, a);
    b.addEventListener("click", function(){
      if(a.done) return;
      var i = a.sel.indexOf(c.id);
      if(i > -1) a.sel.splice(i, 1); else a.sel.push(c.id);
      paintChip(b, c.id, ev, a);
      chk.disabled = a.sel.length === 0;
      save();
    });
    grid.appendChild(b);
  });
  quiz.appendChild(grid);

  var note = el("div", "ev-note");
  var lab = el("label", null, "Your strongest piece of evidence (optional but recommended)");
  lab.setAttribute("for", "evNote");
  var ta = el("textarea");
  ta.id = "evNote"; ta.rows = 3;
  ta.placeholder = "Which detail above convinced you, and which characteristic does it show?";
  ta.value = a.ev || "";
  ta.addEventListener("input", function(){ a.ev = ta.value; save(); });
  note.appendChild(lab); note.appendChild(ta);
  quiz.appendChild(note);

  if(!a.done){
    var act = el("div", "actions");
    chk.addEventListener("click", function(){
      if(a.done || !a.sel.length) return;
      a.done = true; save(); render();
      var fb = $("feedback");
      if(fb){ fb.scrollIntoView({block:"nearest"}); try{ fb.focus({preventScroll:true}); }catch(e){} }
    });
    act.appendChild(chk);
    quiz.appendChild(act);
  }
  art.appendChild(quiz);

  if(a.done) art.appendChild(buildFeedback(ev, a));

  var nav = el("div", "nav-row");
  var prev = el("button", "btn", idx > 0 ? "Back: " + EVENTS[idx-1].short : "Back to the introduction");
  prev.type = "button";
  prev.addEventListener("click", function(){ if(idx > 0) go("event", idx - 1); else go("intro"); });
  nav.appendChild(prev);
  var last = idx === EVENTS.length - 1;
  var next = el("button", "btn" + (a.done ? " primary" : ""), last ? "See my results" : "Next: " + EVENTS[idx+1].short);
  next.type = "button";
  next.addEventListener("click", function(){ if(last) go("results"); else go("event", idx + 1); });
  nav.appendChild(next);
  art.appendChild(nav);
  return art;
}

/* ---------- RENDER: RESULTS ---------- */

function cellFor(ev, cid){
  var a = getAns(ev.id);
  var isCore = ev.core.indexOf(cid) > -1, isAlso = ev.also.indexOf(cid) > -1, picked = a.sel.indexOf(cid) > -1;
  if(!a.done) return {sym:"", cls:"", label:"not checked"};
  if(isCore && picked) return {sym:"✓", cls:"hit", label:"found"};
  if(isCore) return {sym:"○", cls:"miss", label:"missed"};
  if(isAlso && picked) return {sym:"+", cls:"also", label:"also present, selected"};
  if(picked) return {sym:"✕", cls:"wrong", label:"selected, not a strong fit"};
  return {sym:"", cls:"", label:"not selected"};
}

function buildMatrix(){
  var wrap = el("div", "matrix-wrap");
  var tbl = el("table", "matrix");
  var cap = el("caption", "visually-hidden", "Which characteristics of fascism appear in each event");
  tbl.appendChild(cap);
  var thead = el("thead"), tr = el("tr");
  var corner = el("th", "rowh", "Event");
  corner.scope = "col";
  tr.appendChild(corner);
  CHARS.forEach(function(c){
    var th = el("th"); th.scope = "col";
    var ch = el("div", "colhead");
    ch.appendChild(el("span", "vlabel", c.name));
    var dot = el("span", "cdot");
    dot.style.setProperty("--c", colorOf(c));
    ch.appendChild(dot);
    th.appendChild(ch);
    tr.appendChild(th);
  });
  thead.appendChild(tr); tbl.appendChild(thead);

  var tbody = el("tbody");
  EVENTS.forEach(function(ev){
    var a = getAns(ev.id);
    var row = el("tr", a.done ? "" : "todo");
    var rh = el("th", "rowh", ev.year + ": " + ev.short);
    rh.scope = "row";
    row.appendChild(rh);
    CHARS.forEach(function(c){
      var cell = cellFor(ev, c.id);
      var td = el("td", cell.cls, cell.sym);
      td.setAttribute("aria-label", c.name + ", " + cell.label);
      row.appendChild(td);
    });
    tbody.appendChild(row);
  });
  tbl.appendChild(tbody);

  var tfoot = el("tfoot");
  var r1 = el("tr"), r2 = el("tr");
  var h1 = el("th", null, "Events where it is a strong match"); h1.scope = "row";
  var h2 = el("th", null, "Strong matches you found"); h2.scope = "row";
  r1.appendChild(h1); r2.appendChild(h2);
  CHARS.forEach(function(c){
    var key = 0, found = 0;
    EVENTS.forEach(function(ev){
      if(ev.core.indexOf(c.id) > -1){
        key++;
        var a = getAns(ev.id);
        if(a.done && a.sel.indexOf(c.id) > -1) found++;
      }
    });
    r1.appendChild(el("td", null, String(key)));
    r2.appendChild(el("td", null, String(found)));
  });
  tfoot.appendChild(r1); tfoot.appendChild(r2);
  tbl.appendChild(tfoot);
  wrap.appendChild(tbl);
  return wrap;
}

function topCharacteristics(){
  var counts = CHARS.map(function(c){
    var n = 0;
    EVENTS.forEach(function(ev){ if(ev.core.indexOf(c.id) > -1) n++; });
    return {c:c, n:n};
  });
  counts.sort(function(x, y){ return y.n - x.n; });
  return counts;
}

function buildResultsText(){
  var t = totals(), lines = [];
  lines.push("Hitler’s Rise to Power: Fascism Timeline");
  if(state.name) lines.push("Name: " + state.name);
  lines.push("Score: " + t.pts + " / " + t.possible + " (" + t.done + " of " + EVENTS.length + " events checked)");
  lines.push("");
  EVENTS.forEach(function(ev){
    var a = getAns(ev.id);
    if(!a.done) return;
    var names = a.sel.map(function(id){ return CHAR_BY_ID[id].name; }).join(", ");
    lines.push(ev.year + ": " + ev.title);
    lines.push("  My picks: " + (names || "none"));
    if(a.ev) lines.push("  My evidence: " + a.ev);
  });
  lines.push("");
  REFLECT_Q.forEach(function(q, i){
    lines.push("Reflection " + (i + 1) + ": " + q);
    lines.push(state.reflect[i] || "(no answer)");
    lines.push("");
  });
  return lines.join("\n");
}

function buildResults(){
  var t = totals();
  var wrap = el("div", "results");
  var h = el("h2", "card-title", "My results");
  h.id = "cardTitle"; h.tabIndex = -1;
  wrap.appendChild(h);

  var nr = el("div", "name-row");
  var nl = el("label", null, "Your name (for printing)");
  nl.setAttribute("for", "nameIn");
  var ni = el("input"); ni.type = "text"; ni.id = "nameIn"; ni.value = state.name || ""; ni.autocomplete = "off";
  ni.addEventListener("input", function(){ state.name = ni.value; save(); var pn = $("printName"); if(pn) pn.textContent = ni.value ? "Name: " + ni.value : ""; });
  nr.appendChild(nl); nr.appendChild(ni);
  wrap.appendChild(nr);
  var pn = el("p", "print-only", state.name ? "Name: " + state.name : "");
  pn.id = "printName";
  wrap.appendChild(pn);

  wrap.appendChild(el("p", "score-line", "You have checked " + t.done + " of " + EVENTS.length + " events and scored " + t.pts + " out of " + t.possible + " points."));
  if(t.done < EVENTS.length){
    wrap.appendChild(el("p", "hint no-print", "Events you haven’t checked yet appear as blank rows. Use the timeline to go back to them."));
  }

  wrap.appendChild(el("h3", "section-h", "Where each characteristic showed up"));
  wrap.appendChild(buildMatrix());
  var lg = el("p", "legend");
  lg.innerHTML = "";
  [["✓","hit","found it"],["○","miss","missed"],["+","also","also present, and you caught it"],["✕","wrong","not a strong fit"]].forEach(function(x){
    var s = el("span");
    var b = el("b", null, x[0]); b.style.color = "var(--" + (x[1] === "hit" ? "good" : x[1] === "miss" ? "miss" : x[1] === "also" ? "accent" : "bad") + ")";
    s.appendChild(b); s.appendChild(document.createTextNode(" " + x[2]));
    lg.appendChild(s);
  });
  wrap.appendChild(lg);

  var top = topCharacteristics();
  wrap.appendChild(el("p", "score-line", "Across these seventeen events, the tools used most often were " + top[0].c.name + " (" + top[0].n + " events), " + top[1].c.name + " (" + top[1].n + "), and " + top[2].c.name + " (" + top[2].n + ")."));

  wrap.appendChild(el("h3", "section-h", "Your notes by event"));
  var list = el("ul", "notes-list");
  var any = false;
  EVENTS.forEach(function(ev){
    var a = getAns(ev.id);
    if(!a.done) return;
    any = true;
    var li = el("li");
    li.appendChild(el("strong", null, ev.year + ": " + ev.title));
    var tags = el("div", "tag-row");
    a.sel.forEach(function(id){
      var c = CHAR_BY_ID[id];
      var tg = el("span", "tag", c.name);
      tg.style.setProperty("--c", colorOf(c));
      tags.appendChild(tg);
    });
    li.appendChild(tags);
    if(a.ev) li.appendChild(el("div", null, "Evidence: " + a.ev));
    list.appendChild(li);
  });
  if(!any) list.appendChild(el("li", null, "No events checked yet."));
  wrap.appendChild(list);

  wrap.appendChild(el("h3", "section-h", "Reflect"));
  var rf = el("div", "reflect");
  REFLECT_Q.forEach(function(q, i){
    var l = el("label", null, (i + 1) + ". " + q);
    var id = "refl" + i;
    l.setAttribute("for", id);
    var ta = el("textarea"); ta.id = id; ta.rows = 4; ta.value = state.reflect[i] || "";
    ta.addEventListener("input", function(){ state.reflect[i] = ta.value; save(); });
    rf.appendChild(l); rf.appendChild(ta);
  });
  wrap.appendChild(rf);

  var after = el("div", "after");
  after.appendChild(el("p", null, "This timeline stops in 1936, but the story does not. In November 1938, the Nazis staged a nationwide pogrom against Jews known as Kristallnacht. In 1939 Germany invaded Poland and World War II began. Between 1941 and 1945, the Nazi regime murdered six million Jews and millions of others, including Roma, disabled people, political prisoners, and Soviet prisoners of war."));
  wrap.appendChild(after);

  var act = el("div", "actions no-print");
  var pr = el("button", "btn primary", "Print or save as PDF");
  pr.type = "button";
  pr.addEventListener("click", function(){ try{ window.print(); }catch(e){} });
  var cp = el("button", "btn", "Copy my answers as text");
  cp.type = "button";
  var so = el("button", "btn ghost", "Start over");
  so.type = "button";
  act.appendChild(pr); act.appendChild(cp); act.appendChild(so);
  wrap.appendChild(act);

  var box = el("div", "copy-box");
  box.hidden = true;
  var msg = el("p", "hint", "");
  var cta = el("textarea"); cta.readOnly = true; cta.setAttribute("aria-label", "Your answers as plain text");
  box.appendChild(msg); box.appendChild(cta);
  wrap.appendChild(box);

  cp.addEventListener("click", function(){
    var txt = buildResultsText();
    cta.value = txt;
    var done = function(ok){
      box.hidden = false;
      msg.textContent = ok ? "Copied to your clipboard. You can also select the text below." : "Select the text below and copy it (Ctrl+C or Cmd+C).";
      if(!ok){ cta.focus(); cta.select(); }
    };
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(function(){ done(true); }, function(){ done(false); });
      } else { done(false); }
    }catch(e){ done(false); }
  });

  var armed = false;
  so.addEventListener("click", function(){
    if(!armed){
      armed = true;
      so.textContent = "Click again to erase all my answers";
      return;
    }
    state = fresh(); save(); go("intro");
  });
  return wrap;
}

/* ---------- MAIN RENDER ---------- */

function render(){
  renderProgress();
  renderRail();
  var s = $("stage");
  s.innerHTML = "";
  if(state.view === "results") s.appendChild(buildResults());
  else if(state.view === "event") s.appendChild(buildEvent(state.i));
  else s.appendChild(buildIntro());
}

/* toolkit toggle */
var tk = $("toolkit");
tk.appendChild(buildToolkitList());
$("toolkitBtn").addEventListener("click", function(){
  var open = tk.hidden;
  tk.hidden = !open;
  this.setAttribute("aria-expanded", open ? "true" : "false");
  this.textContent = open ? "Hide the eight characteristics" : "Show the eight characteristics";
});

if(state.i < 0 || state.i >= EVENTS.length) state.i = 0;
render();
})();
</script>
