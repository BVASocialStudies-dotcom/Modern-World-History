<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Holocaust, 1933–1945</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#170f1e; --wall-2:#241830; --wall-ink:#e2d9ea; --wall-muted:#9486a3; --wall-rule:#33263f;
  --page:#1f1628; --ink:#e6dfeb; --muted:#a699b3; --rule:#3a2d46;
  --flame:#b596d8;
  --serif:"Spectral",Georgia,"Times New Roman",serif;
  --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#1c1425; --wall:#140d1b; }
}
:root[data-theme="dark"]{ --page:#1c1425; --wall:#140d1b; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--page)}
body{margin:0;background:radial-gradient(ellipse at 70% -20%,#2b1f38 0%,var(--page) 55%) fixed,var(--page);color:var(--ink);font-family:var(--serif);font-size:1.125rem;line-height:1.7}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}

/* Memorial-wall navigation */
aside{background:var(--wall);color:var(--wall-ink);padding:2.25rem 1.5rem;position:sticky;top:0;height:100vh;overflow-y:auto}
.site-title{font-family:var(--serif);font-weight:500;font-size:1.9rem;line-height:1.1;margin:0}
.site-years{font-family:var(--sans);font-size:.85rem;color:var(--wall-muted);margin:.4rem 0 2rem;letter-spacing:.04em}
nav ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--wall-rule)}
nav li{border-bottom:1px solid var(--wall-rule)}
nav button{
  width:100%;display:grid;grid-template-columns:1.6rem 1fr;gap:.6rem;align-items:baseline;text-align:left;
  background:none;border:0;color:var(--wall-muted);padding:.85rem .25rem .85rem .5rem;cursor:pointer;
  border-left:3px solid transparent;font:inherit
}
nav .num{font-family:var(--sans);font-size:.85rem}
nav .t{font-family:var(--serif);font-size:1.05rem;line-height:1.3;color:var(--wall-ink);display:block}
nav .y{font-family:var(--sans);font-size:.78rem;display:block;margin-top:.15rem}
nav button:hover{background:var(--wall-2)}
nav button[aria-current="page"]{border-left-color:var(--flame);background:var(--wall-2)}
nav button[aria-current="page"] .num{color:var(--flame)}
button:focus-visible{outline:2px solid var(--flame);outline-offset:2px}

/* Scrolling hero backgrounds */
main{position:relative;isolation:isolate}
.scenes{position:fixed;top:0;right:0;bottom:0;left:300px;z-index:-1;pointer-events:none;overflow:hidden}
.scene{position:absolute;inset:0;background-position:right center;background-size:cover;background-repeat:no-repeat;
  filter:grayscale(1) contrast(1.05) blur(1px);opacity:0;transition:opacity 1.4s ease}
.scene.on{opacity:.2}
.scenes::after{content:"";position:absolute;inset:0;background:
  linear-gradient(90deg,var(--page) 0%,color-mix(in srgb,var(--page) 82%,transparent) 40%,color-mix(in srgb,var(--page) 25%,transparent) 100%),
  linear-gradient(180deg,transparent 60%,var(--page) 100%)}
.scenes:empty{display:none}
.scene-mark{height:0}
@media (max-width:860px){
  .scenes{left:0}
  .scene{background-position:center}
  .scene.on{opacity:.14}
}
@media (prefers-reduced-motion:reduce){.scene{transition:none}}

/* Reading column */
main{padding:3.5rem clamp(1.25rem,5vw,4.5rem) 4rem}
article{max-width:44rem}
.part{font-family:var(--sans);font-size:.9rem;color:var(--muted);margin:0 0 .6rem}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(2.2rem,4.6vw,3.4rem);line-height:1.08;margin:0}
.years{font-family:var(--serif);font-style:italic;font-size:1.3rem;color:var(--muted);margin:.5rem 0 0}
.head{padding-bottom:1.75rem;margin-bottom:2rem;border-bottom:1px solid var(--rule)}
h2{font-family:var(--serif);font-weight:500;font-size:1.65rem;line-height:1.2;margin:2.4rem 0 .6rem}
h3{font-family:var(--sans);font-weight:600;font-size:1.05rem;margin:1.8rem 0 .4rem}
p{margin:0 0 1.1rem}
ul.list{margin:0 0 1.2rem;padding-left:1.2rem}
ul.list li{margin-bottom:.5rem}
figure{margin:2rem 0}
figure img{display:block;max-width:100%;height:auto;filter:grayscale(.15);box-shadow:0 0 0 1px var(--rule)}
figcaption{font-family:var(--sans);font-size:.88rem;color:var(--muted);margin-top:.6rem;line-height:1.5}
blockquote{white-space:pre-line;margin:2rem 0;padding:0 0 0 1.4rem;border-left:2px solid var(--flame);font-style:italic;font-size:1.25rem;line-height:1.55}
blockquote.pending{color:var(--muted);font-size:1.05rem}
blockquote cite{white-space:normal;display:block;margin-top:.6rem;font-style:normal;font-family:var(--sans);font-size:.88rem;color:var(--muted)}
.stat{display:flex;align-items:baseline;gap:1rem;padding:1rem 0;border-bottom:1px solid var(--rule)}
.stat b{font-family:var(--serif);font-weight:500;font-size:2.2rem;line-height:1;min-width:8ch}
.stat span{color:var(--muted)}
.empty{color:var(--muted);font-style:italic}

.pager{max-width:44rem;display:flex;justify-content:space-between;gap:1rem;margin-top:3.5rem;padding-top:1.5rem;border-top:1px solid var(--rule)}
.pager button{font:inherit;font-family:var(--sans);font-size:.95rem;background:none;border:1px solid var(--rule);color:var(--ink);padding:.6rem 1rem;cursor:pointer;text-align:left;max-width:48%}
.pager button:hover{border-color:var(--flame)}
.pager small{display:block;color:var(--muted);font-size:.8rem}
.pager .next{text-align:right;margin-left:auto}

@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  aside{position:static;height:auto;padding:1.5rem 1.25rem 1rem}
  .site-years{margin-bottom:1rem}
  nav ol{display:flex;overflow-x:auto;border-top:0;gap:.25rem}
  nav li{border-bottom:0;flex:none}
  nav button{grid-template-columns:auto;width:auto;border-left:0;border-bottom:3px solid transparent;padding:.5rem .7rem}
  nav button[aria-current="page"]{border-bottom-color:var(--flame)}
  nav .num,nav .y{display:none}
  nav .t{font-size:.98rem;white-space:nowrap}
  main{padding-top:2rem}
}
</style>
</head>
<body>
<div class="layout">
  <aside>
    <p class="site-title">The Holocaust</p>
    <p class="site-years">1933 – 1945</p>
    <nav aria-label="Assignment pages"><ol id="nav"></ol></nav>
  </aside>
  <main id="main" tabindex="-1">
    <div class="scenes" id="scenes" aria-hidden="true"></div>
    <article id="article"></article>
    <div class="pager" id="pager"></div>
  </main>
</div>

    return `<blockquote>${esc(q)}${b.cite?`<cite>${esc(b.cite)}</cite>`:""}</blockquote>`;
  }
  if(b.scene) return `<div class="scene-mark" data-scene="${b.scene-1}"></div>`;
  if(b.stat) return `<div class="stat"><b>${esc(b.stat)}</b><span>${esc(b.label||"")}</span></div>`;
  return "";
}

function render(){
  nav.innerHTML = PAGES.map((p,i)=>`<li><button data-i="${i}" ${i===current?'aria-current="page"':""}>
    <span class="num">${i+1}</span><span><span class="t">${esc(p.title)}</span>${p.years?`<span class="y">${esc(p.years)}</span>`:""}</span></button></li>`).join("");
  nav.querySelectorAll("button").forEach(b=>b.onclick=()=>go(+b.dataset.i));

  const p = PAGES[current];
  const scenes = p.scenes || [];
  scenesEl.innerHTML = scenes.map((s,i)=>{
    const sc = typeof s === "string" ? {src:s} : s;
    const extra = (sc.size ? `background-size:${sc.size};-webkit-mask-image:linear-gradient(90deg,transparent 30%,#000 62%);mask-image:linear-gradient(90deg,transparent 30%,#000 62%);` : "") + (sc.pos ? `background-position:${sc.pos};` : "") + ((sc.origin||sc.pos) ? `transform-origin:${sc.origin||sc.pos};` : "") + (sc.zoom ? `transform:scale(${sc.zoom});` : "");
    return `<div class="scene${i===0?" on":""}" style="background-image:url('${sc.src}');${extra}"></div>`;
  }).join("");
  article.innerHTML = `<header class="head"><p class="part">Part ${current+1} of ${PAGES.length}</p>
    <h1>${esc(p.title)}</h1>${p.years?`<p class="years">${esc(p.years)}</p>`:""}</header>
    ${p.blocks.length ? p.blocks.map(block).join("") : `<p class="empty">This page's content hasn't been added yet.</p>`}`;

  const prev = PAGES[current-1], next = PAGES[current+1];
  pager.innerHTML = (prev?`<button id="prev"><small>Previous</small>${esc(prev.title)}</button>`:"") +
                    (next?`<button id="next" class="next"><small>Next</small>${esc(next.title)}</button>`:"");
  if(prev) document.getElementById("prev").onclick=()=>go(current-1);
  if(next) document.getElementById("next").onclick=()=>go(current+1);
  document.title = `${p.title} | The Holocaust, 1933–1945`;
}

/* Pick the background for the current scroll position.
   With {scene:n} markers: the last marker above the middle of the screen wins.
   Without markers: the page is split evenly among its backgrounds. */
function updateScene(){
  const layers = scenesEl.children;
  if(layers.length < 2) return;
  const marks = article.querySelectorAll(".scene-mark");
  let idx = 0;
  if(marks.length){
    const mid = window.innerHeight * 0.5;
    let last = null;
    marks.forEach(m => { if(m.getBoundingClientRect().top < mid){ idx = +m.dataset.scene; last = m; } });
    /* Backgrounds with no marker of their own share the space after the last marker evenly */
    const finalMark = marks[marks.length-1], finalScene = +finalMark.dataset.scene;
    if(last === finalMark && finalScene < layers.length-1){
      const start = finalMark.getBoundingClientRect().top + window.scrollY;
      const end = document.documentElement.scrollHeight;
      const prog = end > start ? (window.scrollY + mid - start) / (end - start) : 0;
      idx = finalScene + Math.floor(Math.max(0,Math.min(0.999,prog)) * (layers.length - finalScene));
    }
  } else {
    const max = document.documentElement.scrollHeight - window.innerHeight;
    const prog = max > 0 ? window.scrollY / max : 0;
    idx = Math.min(layers.length - 1, Math.floor(prog * layers.length));
  }
  idx = Math.max(0, Math.min(layers.length - 1, idx));
  [...layers].forEach((l,i) => l.classList.toggle("on", i === idx));
}
let ticking = false;
window.addEventListener("scroll", () => { if(!ticking){ ticking = true; requestAnimationFrame(() => { updateScene(); ticking = false; }); } }, {passive:true});
window.addEventListener("resize", updateScene);

function go(i){
  current = i; render();
  try{ history.replaceState(null,"","#page-"+(i+1)); }catch(e){}
  window.scrollTo(0,0); main.focus({preventScroll:true});
}

const m = location.hash.match(/page-(\d)/);
if(m && +m[1]>=1 && +m[1]<=PAGES.length) current = +m[1]-1;
render();
updateScene();
</script>
</body>
</html>
