<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Alliance System, 1789–1914</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #23201b;
    --ink-soft: #56503f;
    --parchment: #e9decb;
    --parchment-deep: #ddcfb2;
    --parchment-card: #f3ead9;
    --line: #c9b98f;
    --burgundy: #6c2c34;
    --burgundy-deep: #501f26;
    --brass: #96712f;
    --forest: #3c4f3f;
    --entente: #6c2c34;
    --central: #3c4f3f;
    --shadow: rgba(35, 32, 27, 0.18);
    box-sizing: border-box;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --ink: #ece4d3;
      --ink-soft: #c3b8a0;
      --parchment: #1c1a16;
      --parchment-deep: #14120f;
      --parchment-card: #262319;
      --line: #4a4130;
      --shadow: rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    --ink: #ece4d3;
    --ink-soft: #c3b8a0;
    --parchment: #1c1a16;
    --parchment-deep: #14120f;
    --parchment-card: #262319;
    --line: #4a4130;
    --shadow: rgba(0, 0, 0, 0.5);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }
  body {
    background: var(--parchment);
    background-image:
      radial-gradient(ellipse at top left, rgba(150,113,47,0.08), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(108,44,52,0.07), transparent 55%);
    color: var(--ink);
    font-family: "Source Serif 4", Georgia, serif;
    line-height: 1.55;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    min-height: 100%;
  }
  .wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 2.4rem 1.4rem 4rem;
  }
  h1, h2, h3 {
    font-family: "Fraunces", "Source Serif 4", serif;
    font-weight: 600;
    letter-spacing: 0.01em;
    margin: 0 0 0.4em;
    color: var(--ink);
  }
  .masthead {
    text-align: center;
    margin-bottom: 2.2rem;
  }
  .masthead .kicker {
    font-family: "Courier Prime", monospace;
    font-size: 0.78rem;
    letter-spacing: 0.14em;
    color: var(--brass);
  }
  .masthead h1 {
    font-size: clamp(2rem, 5vw, 2.9rem);
    font-style: italic;
    line-height: 1.1;
    margin-top: 0.3em;
  }
  .masthead .dates {
    font-family: "Courier Prime", monospace;
    font-size: 0.95rem;
    color: var(--ink-soft);
    letter-spacing: 0.06em;
  }
  .rule {
    border: none;
    border-top: 1px solid var(--line);
    margin: 1.6rem 0;
  }
  .rule.thick { border-top-width: 3px; border-color: var(--ink); opacity: 0.75; }

  /* Nation select */
  .nation-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 1rem;
    margin-top: 1.6rem;
  }
  .nation-card {
    background: var(--parchment-card);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 1.3rem 1.2rem;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    color: inherit;
    display: flex;
    gap: 0.9rem;
    align-items: center;
    position: relative;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .nation-card:hover, .nation-card:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 8px 18px var(--shadow);
    border-color: var(--brass);
    outline: none;
  }
  .seal {
    flex: 0 0 auto;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Fraunces", serif;
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--parchment-card);
    background: var(--burgundy);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.18), 0 2px 4px var(--shadow);
  }
  .nation-card .name {
    font-family: "Fraunces", serif;
    font-weight: 600;
    font-size: 1.14rem;
  }
  .nation-card .sub {
    font-size: 0.86rem;
    color: var(--ink-soft);
    margin-top: 0.15rem;
  }

  /* Buttons */
  button {
    font-family: "Courier Prime", monospace;
    font-size: 0.82rem;
    letter-spacing: 0.04em;
    background: var(--ink);
    color: var(--parchment);
    border: none;
    padding: 0.65rem 1.1rem;
    border-radius: 2px;
    cursor: pointer;
  }
  button.secondary {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
  }
  button.wide { width: 100%; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-row { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 1.2rem; }

  /* Dashboard */
  .dossier-head {
    display: flex; align-items: center; gap: 1rem; margin-bottom: 0.4rem;
  }
  .dossier-head .seal { width: 64px; height: 64px; font-size: 1.3rem; }
  .stamp {
    display: inline-block;
    font-family: "Courier Prime", monospace;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    color: var(--brass);
    border: 1px solid var(--brass);
    padding: 0.15rem 0.5rem;
    border-radius: 2px;
    margin-bottom: 0.5rem;
  }
  .panel {
    background: var(--parchment-card);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 1.3rem 1.4rem;
    margin-bottom: 1.1rem;
  }
  .panel h3 {
    font-size: 1rem;
    font-family: "Courier Prime", monospace;
    letter-spacing: 0.06em;
    color: var(--brass);
    text-transform: uppercase;
  }
  .panel ul { margin: 0.4em 0 0; padding-left: 1.2em; }
  .panel li { margin-bottom: 0.45em; }
  textarea {
    width: 100%;
    min-height: 130px;
    font-family: "Source Serif 4", serif;
    font-size: 0.98rem;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 0.7rem;
    color: var(--ink);
    resize: vertical;
  }
  .save-note { font-size: 0.78rem; color: var(--ink-soft); margin-top: 0.35rem; }

  /* Round timeline */
  .timeline {
    display: flex;
    overflow-x: auto;
    gap: 0.4rem;
    padding-bottom: 0.6rem;
    margin-bottom: 1.4rem;
  }
  .timeline::-webkit-scrollbar { height: 5px; }
  .tstep {
    flex: 0 0 auto;
    font-family: "Courier Prime", monospace;
    font-size: 0.76rem;
    padding: 0.4rem 0.65rem;
    border: 1px solid var(--line);
    border-radius: 2px;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .tstep.active { background: var(--ink); color: var(--parchment); border-color: var(--ink); }
  .tstep.done { border-color: var(--brass); color: var(--brass); }

  .round-year {
    font-family: "Courier Prime", monospace;
    color: var(--brass);
    letter-spacing: 0.08em;
    font-size: 0.85rem;
  }
  .round-title { font-size: 1.6rem; }

  .picker {
    display: flex;
    flex-wrap: wrap;
    gap: 0.55rem;
    margin: 0.9rem 0 0.4rem;
  }
  .chip {
    font-family: "Courier Prime", monospace;
    font-size: 0.82rem;
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 0.4rem 0.85rem;
    cursor: pointer;
    background: transparent;
    color: var(--ink);
    user-select: none;
  }
  .chip.selected {
    background: var(--burgundy);
    border-color: var(--burgundy);
    color: var(--parchment-card);
  }
  .outcome {
    margin-top: 1.2rem;
    padding: 1.1rem 1.3rem;
    border-left: 3px solid var(--brass);
    background: var(--parchment-deep);
    font-style: italic;
  }
  .outcome .label {
    display: block;
    font-family: "Courier Prime", monospace;
    font-style: normal;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    color: var(--brass);
    margin-bottom: 0.4em;
  }

  svg text { font-family: "Courier Prime", monospace; }
  .graph-wrap {
    background: var(--parchment-card);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 1rem;
    margin-top: 1rem;
  }
  .legend { display: flex; gap: 1.2rem; font-size: 0.8rem; color: var(--ink-soft); margin-top: 0.6rem; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 0.4rem; }
  .swatch { width: 14px; height: 3px; display: inline-block; }

  .final-blocs { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem; }
  @media (max-width: 620px) { .final-blocs { grid-template-columns: 1fr; } }
  .bloc-box { border: 1px solid var(--line); border-radius: 3px; padding: 1rem 1.2rem; }
  .bloc-box h4 { font-family: "Fraunces", serif; margin: 0 0 0.3em; font-size: 1.05rem; }
  .bloc-box.entente { border-left: 4px solid var(--entente); }
  .bloc-box.central { border-left: 4px solid var(--central); }

  .req-row {
    display: flex; justify-content: space-between; align-items: center; gap: 0.6rem;
    padding: 0.6rem 0; border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  .req-row:last-child { border-bottom: none; }
  .req-name { font-family: "Fraunces", serif; font-weight: 600; }
  .req-status { font-size: 0.8rem; color: var(--ink-soft); font-family: "Courier Prime", monospace; }
  .badge-allied {
    font-family: "Courier Prime", monospace; font-size: 0.72rem; letter-spacing: 0.08em;
    color: var(--brass); border: 1px solid var(--brass); padding: 0.15rem 0.5rem; border-radius: 2px;
  }
  .badge-war {
    font-family: "Courier Prime", monospace; font-size: 0.72rem; letter-spacing: 0.08em;
    color: var(--burgundy); border: 1px solid var(--burgundy); padding: 0.15rem 0.5rem; border-radius: 2px;
  }
  .elsewhere-list { margin: 0.4em 0 0; padding-left: 1.1em; font-size: 0.88rem; color: var(--ink-soft); }
  .elsewhere-list li { margin-bottom: 0.3em; }

  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.6rem; }
  .topbar .who { font-family: "Courier Prime", monospace; font-size: 0.8rem; color: var(--ink-soft); }
</style>
</head>

  var ORDER = ["britain","france","russia","austria","germany","ottoman"];

  var ROUNDS = [
    { year: "Late 1700s", title: "Revolution and the First Coalitions",
      context: "In 1789, revolution engulfs France and the execution of the king shocks Europe's monarchies. Fearing revolutionary ideas will spread across their own borders, the great powers move to contain France by force. A few years later, France's most brilliant general, Napoleon Bonaparte, invades Ottoman Egypt \u2014 pulling the Ottoman Empire into the wars as well. (Note: in this era, Germany plays as the Kingdom of Prussia, and Austria-Hungary plays as the Austrian Empire.)",

        },

    { year: "1800\u20131815", title: "The Napoleonic Wars",

  function makePeace(fromId, toId){
    if (!docRef || !shared) return;
    var key = requestKey(fromId, toId);
    var rel = shared.relations[key];
    if (!rel || rel.status !== "war") return;
    var patch = {};
    patch[key] = { from: fromId, to: toId, status: "peace" };
    docRef.update({ relations: patch })["catch"](function(){});
  }
  function toggleNeutral(myId){
    if (!docRef || !shared) return;
    var patch = {};
    patch[myId] = !shared.neutral[myId];
    docRef.update({ neutral: patch })["catch"](function(){});
  }
  function revealRound(){
    if (!docRef || !shared) return;
    docRef.update({ revealed: true })["catch"](function(){});
  }
  function nextRound(){
    if (!docRef || !shared) return;
    var isLast = shared.round === ROUNDS.length - 1;
    if (isLast) {
      docRef.set(defaultShared())["catch"](function(){});
    } else {
      docRef.set({ round: shared.round + 1, revealed: false, edges: shared.edges, relations: {}, neutral: {} })["catch"](function(){});
    }
  }
  function resetShared(){
    if (!docRef) return;
    docRef.set(defaultShared())["catch"](function(){});
  }

  var app = document.getElementById("app");

  function render(){
    if (state.screen === "start") renderStart();
    else if (state.screen === "nation") renderNation(state.nationId);
  }

  function el(html){
    var d = document.createElement("div");
    d.innerHTML = html;
    return d.firstElementChild;
  }

  function timelineHtml(m){
    return '<div class="timeline">' + ROUNDS.map(function(rr, i){
      var cls = "tstep" + (i === m.round ? " active" : (i < m.round || (i === m.round && m.revealed) ? " done" : ""));
      return '<div class="' + cls + '">' + rr.year + '</div>';
    }).join("") + '</div>';
  }

  function renderStart(){
    var cards = ORDER.map(function(id){
      var n = NATIONS[id];
      return '<button class="nation-card" data-nation="' + id + '">' +
        '<span class="seal">' + n.code + '</span>' +
        '<span><span class="name">' + n.name + '</span><br><span class="sub">' + n.tagline + '</span></span>' +
        '</button>';
    }).join("");

    app.innerHTML =
      '<div class="masthead">' +
        '<div class="kicker">A CLASSROOM DIPLOMATIC SIMULATION</div>' +
        '<h1>The Alliance System</h1>' +
        '<div class="dates">1789 &ndash; 1914</div>' +
      '</div>' +
      '<p>Six great powers. Six eras, from the French Revolution to the outbreak of the First World War. One question: will your choices lead somewhere different than history &mdash; or straight back to it?</p>' +
      '<p>Each player selects their nation on their own laptop and reads their private brief. Negotiate with your classmates &mdash; in person or in chat &mdash; then record your own nation\u2019s alignment each round. The alliance web updates live for everyone.</p>' +
      '<hr class="rule">' +
      '<h3 style="font-family:\'Courier Prime\',monospace;font-size:0.85rem;letter-spacing:0.08em;color:var(--brass);text-transform:uppercase;">Choose your power</h3>' +
      '<div class="nation-grid">' + cards + '</div>';

    Array.prototype.forEach.call(app.querySelectorAll(".nation-card[data-nation]"), function(btn){
      btn.addEventListener("click", function(){
        state.screen = "nation";
        state.nationId = btn.getAttribute("data-nation");
        render();
        window.scrollTo(0,0);
      });
    });
  }

  function buildLiveRoundPanel(myId){
    if (dbState === "pending") {
      return '<div class="panel"><h3>Class negotiation</h3><p style="margin:0;color:var(--ink-soft);">Connecting to the shared game board&hellip;</p></div>';
    }
    if (dbState === "unavailable" || !shared) {
      return '<div class="panel"><h3>Class negotiation</h3><p style="margin:0;color:var(--ink-soft);">Live sync isn\u2019t available in this view. Play this game through its published Claude link, shared with your classmates, so everyone\u2019s laptop stays in sync.</p></div>';
    }
    var m = shared;
    var baseRound = ROUNDS[m.round];
    var perspective = (baseRound.perspectives && baseRound.perspectives[myId]) || {};
    var r = {
      year: baseRound.year,
      title: perspective.title || baseRound.title,
      context: perspective.context || baseRound.context,
      prompt: perspective.prompt || baseRound.prompt,
      outcome: perspective.outcome || baseRound.outcome
    };
    var isLast = m.round === ROUNDS.length - 1;
    var rels = m.relations;
    var iAmNeutral = !!m.neutral[myId];

    var otherInfo = {};
    ORDER.forEach(function(id){
      if (id === myId) return;
      var key = requestKey(myId, id);
      var rel = rels[key];
      otherInfo[id] = rel ? { status: rel.status, from: rel.from, key: key } : { status: "none", key: key };
    });

    var proposeRows = "";
    if (!m.revealed) {
      proposeRows = ORDER.filter(function(id){ return id !== myId; }).map(function(id){
        var info = otherInfo[id];
        var right;
        if (info.status === "none" || info.status === "declined" || info.status === "ended" || info.status === "peace") {
          var label = info.status === "declined" ? "Declined" : (info.status === "ended" ? "Alliance ended" : (info.status === "peace" ? "At peace" : ""));
          right = (label ? '<span class="req-status">' + label + '</span> ' : "") +
            '<button class="secondary propose-btn" data-target="' + id + '">Propose alliance</button> ' +
            '<button class="secondary warbtn" data-target="' + id + '">Declare war</button>';
        } else if (info.status === "pending" && info.from === myId) {
          right = '<span class="req-status">Awaiting their response&hellip;</span> ' +
            '<button class="secondary warbtn" data-target="' + id + '">Declare war</button>';
        } else if (info.status === "pending") {
          right = '<span class="req-status">They\u2019ve proposed to you</span> ' +
            '<button class="respond-btn" data-key="' + info.key + '" data-accept="1">Accept</button> ' +
            '<button class="secondary respond-btn" data-key="' + info.key + '" data-accept="0">Decline</button> ' +
            '<button class="secondary warbtn" data-target="' + id + '">Declare war</button>';
        } else if (info.status === "accepted") {
          right = '<span class="badge-allied">Allied</span> ' +
            '<button class="secondary endbtn" data-target="' + id + '">End alliance</button> ' +
            '<button class="secondary warbtn" data-target="' + id + '">Declare war</button>';
        } else if (info.status === "war") {
          right = '<span class="badge-war">At war</span> ' +
            '<button class="secondary peacebtn" data-target="' + id + '">Make peace</button>';
        }
        return '<div class="req-row"><span class="req-name">' + NATIONS[id].code + ' &mdash; ' + NATIONS[id].name + '</span><span>' + right + '</span></div>';
      }).join("");
    }

    var neutralHtml = "";
    if (!m.revealed) {
      neutralHtml = '<div class="btn-row" style="margin-top:0.8rem;">' +
        '<button class="secondary" id="neutral-btn">' + (iAmNeutral ? "Withdraw neutrality declaration" : "Declare neutrality this round") + '</button>' +
        (iAmNeutral ? ' <span class="req-status">Currently declared neutral</span>' : "") +
      '</div>';
    }

    var elsewhereRelItems = Object.keys(rels).filter(function(k){
      var rel = rels[k];
      return rel.from !== myId && rel.to !== myId;
    }).map(function(k){
      var rel = rels[k];
      var label = { accepted: "allied", declined: "declined", ended: "alliance ended", war: "at war", peace: "at peace", pending: "pending" }[rel.status] || rel.status;
      return '<li>' + NATIONS[rel.from].code + ' \u2194 ' + NATIONS[rel.to].code + ' &mdash; ' + label + '</li>';
    });
    var elsewhereNeutralItems = ORDER.filter(function(id){ return id !== myId && m.neutral[id]; }).map(function(id){
      return '<li>' + NATIONS[id].code + ' has declared neutrality</li>';
    });
    var elsewhereAll = elsewhereRelItems.concat(elsewhereNeutralItems).join("");
    var elsewhereHtml = (!m.revealed && elsewhereAll)
      ? '<div class="panel"><h3>Elsewhere this round</h3><ul class="elsewhere-list">' + elsewhereAll + '</ul></div>'
      : "";

    var controlsHtml;
    if (!m.revealed) {
      controlsHtml = '<button class="secondary" id="reveal-live-btn">Reveal what actually happened</button>';
    } else {
      controlsHtml = '<button id="next-live-btn">' + (isLast ? "Play again from 1789" : "Next round \u2192") + '</button>';
    }

    var outcomeBlock = m.revealed
      ? '<div class="outcome"><span class="label">What actually happened</span>' + r.outcome + '</div>'
      : "";

    var summaryBlock = "";
    if (m.revealed) {
      var allies = [], atWar = [], declinedOrEnded = [];
      ORDER.forEach(function(id){
        if (id === myId) return;
        var st = otherInfo[id].status;
        if (st === "accepted") allies.push(NATIONS[id].name);
        else if (st === "war") atWar.push(NATIONS[id].name);
        else if (st === "declined" || st === "ended") declinedOrEnded.push(NATIONS[id].name);
      });
      summaryBlock = '<div class="panel"><h3>Your standing after this round</h3>' +
        '<p style="margin:0 0 0.5em;"><strong>Allied with:</strong> ' + (allies.length ? allies.join(", ") : "No one") + '</p>' +
        '<p style="margin:0 0 0.5em;"><strong>At war with:</strong> ' + (atWar.length ? atWar.join(", ") : "No one") + '</p>' +
        (declinedOrEnded.length ? ('<p style="margin:0 0 0.5em;"><strong>No alliance with:</strong> ' + declinedOrEnded.join(", ") + '</p>') : "") +
        (iAmNeutral ? '<p style="margin:0;"><strong>You declared neutrality this round.</strong></p>' : "") +
      '</div>';
    }

    var finalBlock = "";
    if (isLast && m.revealed) {
      finalBlock =
        '<hr class="rule thick">' +
        '<h3 style="font-family:\'Fraunces\',serif;font-size:1.3rem;">Where history landed</h3>' +
        '<div class="final-blocs">' +
          '<div class="bloc-box entente"><h4>The Triple Entente</h4>Great Britain &middot; France &middot; Russia</div>' +
          '<div class="bloc-box central"><h4>The Central Powers</h4>Germany &middot; Austria-Hungary &middot; Ottoman Empire</div>' +
        '</div>';
    }

    return '<div class="panel" id="live-panel">' +
      '<h3>Class negotiation &mdash; live</h3>' +
      timelineHtml(m) +
      '<div class="round-year">' + r.year + '</div>' +
      '<div style="font-family:\'Fraunces\',serif;font-weight:600;font-size:1.2rem;margin-bottom:0.3rem;">' + r.title + '</div>' +
      '<p style="margin-top:0;">' + r.context + '</p>' +
      '<p style="color:var(--ink-soft);"><em>' + r.prompt + '</em></p>' +
      (proposeRows ? ('<div style="margin-top:0.8rem;">' + proposeRows + '</div>') : "") +
      neutralHtml +
      '<div class="btn-row">' + controlsHtml + '</div>' +
      outcomeBlock +
    '</div>' +
    summaryBlock +
    elsewhereHtml +
    finalBlock;
  }

  function renderNation(id){
    var n = NATIONS[id];
    var eraNoteHtml = n.eraNote
      ? '<div class="panel" style="border-color:var(--brass);"><h3>Early-round note</h3><p style="margin:0;">' + n.eraNote + '</p></div>'
      : "";

    app.innerHTML =
      '<div class="topbar">' +
        '<button class="secondary" id="back-btn">&larr; Back</button>' +
        '<span class="who">PRIVATE BRIEF &mdash; DO NOT SHARE SCREEN</span>' +
      '</div>' +
      '<div class="dossier-head">' +
        '<span class="seal">' + n.code + '</span>' +
        '<div><div class="stamp">CONFIDENTIAL</div><h1 style="margin:0;">' + n.name + '</h1></div>' +
      '</div>' +
      '<p style="font-style:italic;color:var(--ink-soft);margin-top:0;">' + n.tagline + '</p>' +
      '<hr class="rule">' +
      eraNoteHtml +
      buildLiveRoundPanel(id);

    document.getElementById("back-btn").addEventListener("click", function(){
      state.screen = "start";
      render();
      window.scrollTo(0,0);
    });

    if (dbState === "live" && shared) {
      Array.prototype.forEach.call(app.querySelectorAll(".propose-btn"), function(btn){
        btn.addEventListener("click", function(){ proposeAlliance(id, btn.getAttribute("data-target")); });
      });
      Array.prototype.forEach.call(app.querySelectorAll(".respond-btn"), function(btn){
        btn.addEventListener("click", function(){
          respondAlliance(btn.getAttribute("data-key"), btn.getAttribute("data-accept") === "1");
        });
      });
      Array.prototype.forEach.call(app.querySelectorAll(".warbtn"), function(btn){
        btn.addEventListener("click", function(){ declareWar(id, btn.getAttribute("data-target")); });
      });
      Array.prototype.forEach.call(app.querySelectorAll(".endbtn"), function(btn){
        btn.addEventListener("click", function(){ endAlliance(id, btn.getAttribute("data-target")); });
      });
      Array.prototype.forEach.call(app.querySelectorAll(".peacebtn"), function(btn){
        btn.addEventListener("click", function(){ makePeace(id, btn.getAttribute("data-target")); });
      });
      var neutralBtn = document.getElementById("neutral-btn");
      if (neutralBtn) neutralBtn.addEventListener("click", function(){ toggleNeutral(id); });
      var revealBtn = document.getElementById("reveal-live-btn");
      if (revealBtn) revealBtn.addEventListener("click", function(){ revealRound(); });
      var nextBtn = document.getElementById("next-live-btn");
      if (nextBtn) nextBtn.addEventListener("click", function(){ nextRound(); window.scrollTo(0,0); });
    }
  }

  render();
})();
</script>
</body>
</html>
