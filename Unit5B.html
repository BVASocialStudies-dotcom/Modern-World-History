<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dividing the Middle East</title>
<style>
  :root{
    --sky:#d4e2f2;
    --sky-deep:#b9cde6;
    --navy:#1b3157;
    --ink:#1d2533;
    --paper:#fbfcfe;
    --right:#2c7a4b;
    --wrong:#b03636;
    --display:"Avenir Next Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
    --body:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--sky);color:var(--ink);font-family:var(--body);}
  header{
    display:flex;align-items:center;gap:1rem;flex-wrap:wrap;
    padding:.8rem 1.25rem;background:var(--navy);color:#fff;
  }
  h1{font-family:var(--display);font-weight:700;font-stretch:condensed;font-size:1.7rem;letter-spacing:.01em;margin:0}
  .instructions{font-size:.95rem;opacity:.9;flex:1 1 320px;margin:0;line-height:1.4}
  .controls{display:flex;gap:.5rem;align-items:center}
  .score{font-family:var(--display);font-size:1.1rem;font-weight:700;min-width:7.5em;text-align:right}
  button.ctl{
    font-family:var(--display);font-weight:700;font-size:1rem;
    border:2px solid #fff;border-radius:6px;padding:.4rem .9rem;cursor:pointer;
    background:#fff;color:var(--navy);
  }
  button.ctl.ghost{background:transparent;color:#fff}
  button.ctl:focus-visible,.card:focus-visible,.slot:focus-visible,.chip:focus-visible{outline:3px solid #f2b705;outline-offset:2px}

  main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:1rem;padding:1rem;align-items:start}
  @media (max-width:1000px){main{grid-template-columns:1fr}}

  .board{position:relative;width:100%;aspect-ratio:2498/1090;border-radius:6px;overflow:visible;
    box-shadow:0 0 0 2px var(--navy);background:var(--sky)}
  .board img{display:block;width:100%;height:100%;border-radius:6px;user-select:none;-webkit-user-drag:none}
  .zone{position:absolute;pointer-events:none;border-radius:10px;border:3px dashed transparent;transition:border-color .12s,background .12s}
  .zone.hot{border-color:#f2b705;background:rgba(242,183,5,.12)}
  .slot{
    position:absolute;transform:translate(-50%,-50%);
    width:1.7rem;height:1.7rem;border-radius:50%;
    border:2px dashed var(--navy);background:rgba(255,255,255,.85);
    color:var(--navy);font:700 1rem/1 var(--display);cursor:pointer;padding:0;
    display:grid;place-items:center;
  }
  .slot.armed{border-style:solid;background:#fff6d6;animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.15)}}
  @media (prefers-reduced-motion:reduce){.slot.armed{animation:none}}
  .chip{
    position:absolute;transform:translate(-50%,-50%);z-index:5;
    max-width:9.5rem;padding:.25rem .55rem;border-radius:5px;
    background:var(--navy);color:#fff;border:2px solid #fff;
    font:700 .85rem/1.15 var(--display);text-align:center;cursor:grab;touch-action:none;
    box-shadow:0 2px 6px rgba(20,35,60,.35);
  }
  .chip.right{background:var(--right)}
  .chip.wrong{background:var(--wrong)}
  .chip.right::after{content:" ✓"}
  .chip.wrong::after{content:" ✗"}

  aside{background:var(--paper);border:2px solid var(--navy);border-radius:6px;display:flex;flex-direction:column;max-height:calc(100vh - 7rem);position:sticky;top:1rem}
  @media (max-width:1000px){aside{position:static;max-height:none}}
  .bank-head{padding:.6rem .9rem;border-bottom:2px solid var(--sky-deep);font:700 1.1rem var(--display);color:var(--navy);display:flex;justify-content:space-between}
  .bank{overflow-y:auto;padding:.7rem;display:flex;flex-direction:column;gap:.6rem;min-height:5rem}
  @media (max-width:1000px){.bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}}
  .bank.hot{background:#fff6d6}
  .card{
    text-align:left;background:#fff;border:2px solid var(--sky-deep);border-left:6px solid var(--navy);
    border-radius:5px;padding:.55rem .7rem;cursor:grab;touch-action:none;color:var(--ink);
    font:700 1.05rem/1.2 var(--display);color:var(--navy);
  }
  .card b{display:block;font:700 1.05rem/1.2 var(--display);color:var(--navy);margin-bottom:.15rem}
  .card.selected{border-color:#f2b705;background:#fffbea}
  .empty-note{color:#4b5a73;font-style:italic;padding:.4rem}

  .ghost-drag{position:fixed;z-index:1000;pointer-events:none;width:220px;opacity:.92;transform:rotate(-2deg);box-shadow:0 8px 22px rgba(20,35,60,.35)}
  .ghost-drag.small{width:auto}

  .pop{
    position:absolute;z-index:20;width:min(240px,80vw);background:var(--paper);border:2px solid var(--navy);
    border-radius:6px;padding:.7rem .8rem;font-size:.9rem;line-height:1.42;box-shadow:0 6px 18px rgba(20,35,60,.3)
  }
  .pop b{display:block;font:700 1.05rem var(--display);color:var(--navy);margin-bottom:.2rem}
  .pop .row{display:flex;gap:.5rem;justify-content:flex-end;margin-top:.6rem}
  .pop button{font:700 .9rem var(--display);border:2px solid var(--navy);border-radius:5px;padding:.25rem .6rem;cursor:pointer;background:#fff;color:var(--navy)}
  .pop button.primary{background:var(--navy);color:#fff}
  .slot.gold{border:3px solid #f2b705;background:var(--navy);color:#f2b705;width:1.9rem;height:1.9rem}
  .slot.arrive{animation:pulse .9s ease-in-out 3}
  @media (prefers-reduced-motion:reduce){.slot.arrive{animation:none}}
  .chip.locked{background:var(--right);cursor:default;pointer-events:none}
  .chip.locked.info{pointer-events:auto;cursor:pointer}
  .card.desc{font:inherit;font-size:.9rem;line-height:1.42;color:var(--ink)}
  .card.desc b{display:block;font:700 1.05rem/1.2 var(--display);color:var(--navy);margin-bottom:.15rem}
  .pop .txt{margin-bottom:.1rem}
  [hidden]{display:none!important}
  .chip.mini{width:1.9rem;height:1.9rem;padding:0;border-radius:50%;max-width:none;border:3px solid #f2b705;
    font:italic 700 1.05rem/1 var(--body);display:grid;place-items:center}
  .chip.mini.right,.chip.mini.locked{border-color:#fff}
  .chip.mini.right::after,.chip.mini.wrong::after{content:none}
  .chip.mini.right{font-size:0}.chip.mini.right::before{content:"\2713";font:700 1rem var(--display)}
  .chip.mini.wrong{font-size:0}.chip.mini.wrong::before{content:"\2717";font:700 1rem var(--display)}
  .chip.mini.locked{font-size:0}.chip.mini.locked::before{content:"\2713";font:700 1rem var(--display)}
  .zone.miss{border-color:var(--wrong);background:rgba(176,54,54,.15)}
  .feedback{margin:0;padding:.45rem .6rem;border-radius:5px;font:700 .95rem var(--display)}
  .feedback.good{background:#e3f1e8;color:var(--right)}
  .feedback.bad{background:#f7e1e1;color:var(--wrong)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

    <span class="score" id="score" aria-live="polite">0 of 11 placed</span>
    <button class="ctl" id="check">Check answers</button>
    <button class="ctl ghost" id="reset">Start over</button>
  </div>
</header>

      {id:"trotskydot",  box:[215,560,80,80],   slot:[255,600]}
    ],
    // Description cards go here later: {id:"<zone id>", name:"<short title>", text:"<description>"}
    cards:[
      {id:"spline", name:"Britain's promise to Hussein", text:"Sharif Hussein bin Ali contacted the British to inform them that he would lead a revolt against Ottoman rule in the Middle East. In return, the British promised him an Arab state he would rule once World War I ended."},
      {id:"spmap", name:"Sykes-Picot Agreement", text:"A secret 1916 agreement between British and French diplomats that would divide the Ottoman Empire under European control."},
      {id:"revolt", name:"Arab Revolt", text:"Hussein delivered on his promise to start a revolt against Ottoman rule. The Arab Revolt was supported by the Allied Powers, and it played an important role in the eventual defeat of the Ottoman Empire."},
      {id:"palestine", name:"Balfour Declaration", text:"In 1917, British Foreign Secretary Arthur Balfour promised British support for a \u201cnational home for the Jewish people\u201d in Palestine, as long as nothing harmed the rights of the non-Jewish communities already living there. Hussein was alarmed because he believed Palestine was part of the Arab state Britain had promised him, so Britain sent him assurances that Jewish settlement would not threaten Arab freedom. Faisal briefly accepted Jewish immigration in a 1919 agreement with Zionist leader Chaim Weizmann, but only on the condition that Britain kept its promise of Arab independence, and when that promise was broken the deal fell apart."},
      {id:"trotskydot", name:"Trotsky Publishes Sykes-Picot", text:"After the Bolsheviks took power in Russia in 1917, Leon Trotsky found the secret Sykes-Picot Agreement in the government's files and published it to embarrass the imperialist powers. Sharif Hussein was not happy to learn about the agreement."},
      {id:"djemalline", name:"Djemal Tried to Broker a Deal", text:"Djemal Pasha, one of the Three Pashas who ruled the Ottoman Empire, reached out to Faisal, Hussein's most talented son, to end the Arab Revolt after Trotsky published the Sykes-Picot Agreement. Faisal rejected Djemal's offer."},
      {id:"kemalline", name:"Turkish War of Independence", text:"After World War I, the Allies planned to divide even the Turkish heartland of the Ottoman Empire, so Mustafa Kemal led Turkish nationalists in a war against Greek and other Allied forces from 1919 to 1923. His victory ended Ottoman rule and created the Republic of Turkey, whose borders the Allies accepted in the 1923 Treaty of Lausanne."},
      {id:"mesopotamia", name:"Faisal Becomes King", text:"In 1920, Faisal was crowned King of Syria in Damascus, but within months the French, who claimed Syria under the Sykes-Picot Agreement, defeated his army at the Battle of Maysalun and forced him out. That same year, a large revolt against British rule in Mesopotamia convinced Britain it needed a friendly Arab ruler, so in 1921 it made Faisal king there, even though he had never lived in the region. Britain combined the former Ottoman provinces of Baghdad, Basra, and Mosul into the Kingdom of Iraq, which stayed under British control until it gained independence in 1932."},
      {id:"transjordan", name:"Abdullah Becomes King", text:"After the French drove his brother Faisal out of Syria, Abdullah arrived in Transjordan with an armed force, and in 1921 Britain made him its ruler under British control, partly to keep him from attacking the French and partly to make up for its broken promises to his family. He ruled as emir until Jordan won independence in 1946 and he became its first king, and today's King Abdullah II is his great-grandson."},
      {id:"mecca", name:"Mecca and Kingdom of Hejaz", text:"Hussein ruled Mecca as King of the Hejaz after the war, but in 1924 he gave the throne to his son Ali, who was quickly driven out by Ibn Saud, a long-time rival of Hussein. Saud viewed the capture of Mecca and Medina, Islam's two holiest cities, as central to establishing his new kingdom, which would later become known as Saudi Arabia."}
    ]
  }
];
const board=document.getElementById('board'), bank=document.getElementById('bank');
const scoreEl=document.getElementById('score'), leftEl=document.getElementById('left');
const checkBtn=document.getElementById('check'), resetBtn=document.getElementById('reset');
const instrEl=document.querySelector('.instructions'), bankTitle=document.querySelector('.bank-head span');
let stage=0, placed={}, checked=false, selected=null, order=[];
let locked=[]; let done=new Set(), mistakes=0, feedback=''; // chips from finished stages: {zone, card}
const pct=(v,t)=>(v/t*100)+'%';
const S=()=>STAGES[stage];
const cardById=()=>Object.fromEntries(S().cards.map(c=>[c.id,c]));

let zoneEls={}, slotEls={};
function buildZones(){
  board.querySelectorAll('.zone,.slot').forEach(n=>n.remove());
  zoneEls={}; slotEls={};
  S().zones.forEach((z,i)=>{
    const [x,y,w,h]=z.box;
    const ze=document.createElement('div'); ze.className='zone';
    Object.assign(ze.style,{left:pct(x,IW),top:pct(y,IH),width:pct(w,IW),height:pct(h,IH)});
    board.appendChild(ze); zoneEls[z.id]=ze;
    const s=document.createElement('button'); s.type='button';
    s.className='slot'+(stage>0?' gold':''); s.textContent='+';
    s.setAttribute('aria-label','Empty drop spot '+(i+1));
    Object.assign(s.style,{left:pct(z.slot[0],IW),top:pct(z.slot[1],IH)});
    s.addEventListener('click',()=>{ if(selected){ const c=selected; selected=null; drop(c,z.id); } });
    board.appendChild(s); slotEls[z.id]=s;
  });
}
function startStage(n){
  stage=n; placed={}; checked=false; selected=null;
  order=S().sequential?S().cards.map(c=>c.id):shuffle(S().cards.map(c=>c.id)); done=new Set(); mistakes=0; feedback='';
  instrEl.textContent=S().instructions; bankTitle.textContent=S().title;
  buildZones(); render();
  if(n>0){ Object.values(slotEls).forEach(s=>s.classList.add('arrive')); setTimeout(()=>Object.values(slotEls).forEach(s=>s.classList.remove('arrive')),2600); }
}
board.addEventListener('click',e=>{
  if(!selected||e.target.closest('.slot,.chip,.pop')) return;
  const zid=zoneAt(e.clientX,e.clientY);
  if(zid){ const c=selected; selected=null; drop(c,zid); }
});

function drop(cid,zid){
  if(!S().sequential){ place(cid,zid); render(); return; }
  const c=cardById()[cid];
  if(zid===cid){
    done.add(cid); locked.push({label:c.name, slot:S().zones.find(z=>z.id===zid).slot, text:c.text});
    feedback={kind:'good',text:'Correct: '+c.name+'.'};
    if(done.size===S().cards.length){ finishAll(); return; }
  } else {
    mistakes++; feedback={kind:'bad',text:'Not that spot. Try a different dot.'};
    const ze=zoneEls[zid]; render(); ze.classList.add('miss'); setTimeout(()=>ze.classList.remove('miss'),700); return;
  }
  render();
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function zoneOfCard(cid){return Object.keys(placed).find(z=>placed[z]===cid);}
function place(cid,zid){
  const from=zoneOfCard(cid), occupant=placed[zid];
  if(from) delete placed[from];
  if(occupant && occupant!==cid && from) placed[from]=occupant;
  placed[zid]=cid; checked=false;
}
function unplace(cid){const z=zoneOfCard(cid); if(z) delete placed[z]; checked=false;}
function zoneAt(cx,cy){
  const r=board.getBoundingClientRect();
  if(cx<r.left||cx>r.right||cy<r.top||cy>r.bottom) return null;
  const ix=(cx-r.left)/r.width*IW, iy=(cy-r.top)/r.height*IH;
  let best=null,area=Infinity;
  S().zones.forEach(z=>{const [x,y,w,h]=z.box;
    if(ix>=x&&ix<=x+w&&iy>=y&&iy<=y+h&&w*h<area){best=z.id;area=w*h;}});
  return best;
}
function overBank(cx,cy){const r=bank.parentElement.getBoundingClientRect();return cx>=r.left&&cx<=r.right&&cy>=r.top&&cy<=r.bottom;}

function makeChip(label,slot,mini){
  const c=document.createElement('button'); c.type='button'; c.className='chip';
  if(mini){ c.classList.add('mini'); c.setAttribute('aria-label',label); c.title=label; c.textContent='i'; return place2(c,slot); }
  c.textContent=label;
  c.style.top=pct(slot[1],IH);
  const fx=slot[0]/IW;
  if(fx<0.08){c.style.left='0.4%';c.style.transform='translate(0,-50%)';}
  else if(fx>0.92){c.style.left='99.6%';c.style.transform='translate(-100%,-50%)';}
  else c.style.left=pct(slot[0],IW);
  return c;
}
function place2(c,slot){ c.style.left=pct(slot[0],IW); c.style.top=pct(slot[1],IH); return c; }
function render(){
  closePop();
  board.querySelectorAll('.chip').forEach(c=>c.remove());
  locked.forEach(l=>{ const c=makeChip(l.label,l.slot,!!l.text); c.classList.add('locked');
    if(l.text){ c.classList.add('info'); c.addEventListener('click',()=>openInfo(c,l)); } else c.tabIndex=-1;
    board.appendChild(c); });
  const byId=cardById();
  S().zones.forEach(z=>{
    const cid=placed[z.id], s=slotEls[z.id];
    s.style.display=(cid||done.has(z.id))?'none':'grid';
    s.classList.toggle('armed',!!selected&&!cid);
    if(cid){
      const c=makeChip(byId[cid].name,z.slot,!!byId[cid].text);
      if(checked) c.classList.add(cid===z.id?'right':'wrong');
      c.dataset.card=cid; attachDrag(c,cid,true); board.appendChild(c);
    }
  });
  bank.innerHTML='';
  let remaining=order.filter(id=>!zoneOfCard(id)&&!done.has(id));
  const seq=!!S().sequential;
  if(seq && feedback){ const f=document.createElement('p'); f.className='feedback '+feedback.kind; f.textContent=feedback.text; bank.appendChild(f); }
  (seq?remaining.slice(0,1):remaining).forEach(id=>{
    const c=byId[id]; const el=document.createElement('button'); el.type='button';
    el.className='card'+(selected===id?' selected':''); el.dataset.card=id;
    if(c.text){ el.innerHTML='<b></b><span></span>'; el.querySelector('b').textContent=c.name; el.querySelector('span').textContent=c.text; el.classList.add('desc'); }
    else el.textContent=c.name;
    el.setAttribute('aria-pressed',selected===id);
    attachDrag(el,id,false); bank.appendChild(el);
  });
  const total=S().cards.length;
  if(!total){ const n=document.createElement('p'); n.className='empty-note'; n.textContent=S().emptyNote||''; bank.appendChild(n); }
  else if(!remaining.length){ const n=document.createElement('p'); n.className='empty-note'; n.textContent='Everything is placed. Press Check answers to see how you did.'; bank.appendChild(n); }
  leftEl.textContent=total?remaining.length+' left':'';
  checkBtn.hidden=resetBtn.hidden=(!total||seq);
  if(seq){ scoreEl.textContent='Event '+Math.min(done.size+1,total)+' of '+total; return; }
  if(!total){ scoreEl.textContent=''; return; }
  if(checked){
    const right=Object.entries(placed).filter(([z,c])=>z===c).length;
    scoreEl.textContent=right+' of '+total+' correct';
  } else scoreEl.textContent=Object.keys(placed).length+' of '+total+' placed';
}

function attachDrag(el,cid,isChip){
  el.addEventListener('pointerdown',e=>{
    if(e.button!==0) return;
    const sx=e.clientX, sy=e.clientY; let ghost=null, hot=null;
    el.setPointerCapture(e.pointerId);
    const move=ev=>{
      if(!ghost){
        if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<6) return;
        ghost=el.cloneNode(true); ghost.classList.add('ghost-drag'); if(isChip) ghost.classList.add('small');
        ghost.classList.remove('right','wrong','selected'); ghost.style.transform='';
        document.body.appendChild(ghost); el.style.opacity='.35'; closePop();
      }
      ghost.style.left=(ev.clientX-(isChip?40:60))+'px'; ghost.style.top=(ev.clientY-20)+'px';
      const z=zoneAt(ev.clientX,ev.clientY);
      if(z!==hot){ if(hot) zoneEls[hot].classList.remove('hot'); hot=z; if(z) zoneEls[z].classList.add('hot'); }
      bank.classList.toggle('hot',isChip&&overBank(ev.clientX,ev.clientY));
      if(ev.clientY<40) window.scrollBy(0,-12); else if(ev.clientY>innerHeight-40) window.scrollBy(0,12);
    };
    const up=ev=>{
      el.removeEventListener('pointermove',move); el.removeEventListener('pointerup',up); el.removeEventListener('pointercancel',up);
      if(hot) zoneEls[hot].classList.remove('hot'); bank.classList.remove('hot');
      if(!ghost){ if(isChip) openPop(el,cid); else { selected=(selected===cid)?null:cid; render(); } return; }
      ghost.remove(); el.style.opacity='';
      if(ev.type==='pointerup'){
        const z=zoneAt(ev.clientX,ev.clientY);
        if(z){ selected=null; ghost=null; drop(cid,z); return; }
        else if(isChip && overBank(ev.clientX,ev.clientY)) unplace(cid);
      }
      render();
    };
    el.addEventListener('pointermove',move); el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
  });
  el.addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key===' '){ e.preventDefault();
      if(isChip) openPop(el,cid); else { selected=(selected===cid)?null:cid; render();
        if(selected){ const first=Object.values(slotEls).find(s=>s.style.display!=='none'); first&&first.focus(); } } }
  });
}

let popEl=null;
function openInfo(chip,l){
  closePop();
  const p=document.createElement('div'); p.className='pop'; p.setAttribute('role','dialog');
  p.innerHTML='<b></b><div class="txt"></div><div class="row"><button type="button" class="primary">Close</button></div>';
  p.querySelector('b').textContent=l.label; p.querySelector('.txt').textContent=l.text;
  positionPop(p,chip);
  p.querySelector('.primary').addEventListener('click',closePop);
  popEl=p; p.querySelector('.primary').focus();
}
function positionPop(p,chip){
  board.appendChild(p);
  const br=board.getBoundingClientRect(), cr=chip.getBoundingClientRect();
  let left=cr.left-br.left+cr.width/2-p.offsetWidth/2;
  left=Math.max(4,Math.min(left,br.width-p.offsetWidth-4));
  let top=cr.bottom-br.top+8; if(top+p.offsetHeight>br.height) top=cr.top-br.top-p.offsetHeight-8;
  p.style.left=left+'px'; p.style.top=Math.max(4,top)+'px';
}
function closePop(){ if(popEl){popEl.remove();popEl=null;} }
function openPop(chip,cid){
  closePop();
  const c=cardById()[cid]; const p=document.createElement('div'); p.className='pop'; p.setAttribute('role','dialog');
  p.innerHTML='<b></b><div class="txt"></div><div class="row"><button type="button" data-a="back">Return to list</button><button type="button" class="primary" data-a="close">Close</button></div>';
  p.querySelector('b').textContent=c.name;
  if(c.text) p.querySelector('.txt').textContent=c.text; else p.querySelector('.txt').remove();
  board.appendChild(p);
  const br=board.getBoundingClientRect(), cr=chip.getBoundingClientRect();
  let left=cr.left-br.left+cr.width/2-p.offsetWidth/2;
  left=Math.max(4,Math.min(left,br.width-p.offsetWidth-4));
  let top=cr.bottom-br.top+8; if(top+p.offsetHeight>br.height) top=cr.top-br.top-p.offsetHeight-8;
  p.style.left=left+'px'; p.style.top=Math.max(4,top)+'px';
  p.addEventListener('click',e=>{const a=e.target.dataset.a; if(a==='back'){unplace(cid);render();} else if(a==='close') closePop();});
  popEl=p; p.querySelector('.primary').focus();
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closePop(); if(selected){selected=null;render();} } });

function finishStage(){
  const byId=cardById();
  S().zones.forEach(z=>{ const c=byId[placed[z.id]]; if(c) locked.push({label:c.name, slot:z.slot, text:c.text}); });
  if(stage+1<STAGES.length) startStage(stage+1);
  else finishAll();
}
function finishAll(){
  placed={}; render();
  instrEl.textContent='Assignment complete. Every name and description is matched.';
  bankTitle.textContent='Complete'; leftEl.textContent='';
  bank.innerHTML='<p class="empty-note">You matched all '+STAGES.reduce((n,s)=>n+s.cards.length,0)+' cards. Wrong tries on the events: '+mistakes+'. Tap any check mark on the image to review an event.</p>';
  checkBtn.hidden=resetBtn.hidden=true; scoreEl.textContent='Complete';
  board.querySelectorAll('.slot').forEach(s=>s.style.display='none');
}
checkBtn.addEventListener('click',()=>{
  checked=true; render();
  const total=S().cards.length;
  const right=Object.entries(placed).filter(([z,c])=>z===c).length;
  if(total && right===total){ scoreEl.textContent='All '+total+' correct'; setTimeout(finishStage,1200); }
});
resetBtn.addEventListener('click',()=>{
  if(Object.keys(placed).length && !confirm('Clear every placed card in this part and start over?')) return;
  placed={}; checked=false; selected=null; order=shuffle(order); render();
});

// Teacher preview: add #stage2 to the end of the address to skip straight to part two
if(location.hash==='#stage2'){
  STAGES[0].zones.forEach(z=>{ const c=STAGES[0].cards.find(k=>k.id===z.id); locked.push({label:c.name, slot:z.slot}); });
  startStage(1);
} else startStage(0);
})();
</script>
