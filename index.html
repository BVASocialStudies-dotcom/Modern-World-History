<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern World History | Activity Hub</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --success: #22c55e;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 2rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      color: var(--accent);
    }

    p.subtitle {
      color: var(--muted);
      font-size: 1.1rem;
    }

    .controls {
      text-align: center;
      margin-bottom: 2rem;
    }

    .save-btn {
      background: var(--success);
      color: #fff;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: opacity 0.2s;
    }

    .save-btn:hover {
      opacity: 0.9;
    }

    .unit-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .unit-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .unit-card h2 {
      font-size: 1.5rem;
      margin-top: 0;
      margin-bottom: 1rem;
      border-bottom: 2px solid var(--border);
      padding-bottom: 0.5rem;
      color: var(--accent);
    }

    .slot {
      background: #0f172a;
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
    }

    .slot:last-child {
      margin-bottom: 0;
    }

    .slot-title {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    input[type="text"] {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: monospace;
      padding: 0.5rem;
      border-radius: 4px;
      font-size: 0.85rem;
      box-sizing: border-box;
      margin-bottom: 0.5rem;
    }

    .activity-link {
      display: inline-block;
      color: var(--accent);
      font-weight: bold;
      text-decoration: none;
      font-size: 0.9rem;
      margin-top: 0.25rem;
    }

    .activity-link:hover {
      text-decoration: underline;
    }

    .activity-link.disabled {
      color: var(--muted);
      pointer-events: none;
      opacity: 0.5;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>Modern World History</h1>
    <p class="subtitle">Class Activity & Resource Hub</p>
  </header>

  <div class="controls">
    <button class="save-btn" onclick="saveData()">💾 Save All Links</button>
  </div>

  <main class="unit-grid" id="grid"></main>

  <script>
    const totalUnits = 8;
    const activitiesPerUnit = 3;
    const grid = document.getElementById('grid');

    // Generate 8 Units with 3 Activity slots each
    for (let u = 1; u <= totalUnits; u++) {
      const card = document.createElement('section');
      card.className = 'unit-card';
      let cardHTML = `<h2>Unit ${u}</h2>`;

      for (let a = 1; a <= activitiesPerUnit; a++) {
        const id = `u${u}-a${a}`;
        cardHTML += `
          <div class="slot">
            <div class="slot-title">Activity ${a}</div>
            <input type="text" id="${id}-input" placeholder="Paste link or game code URL..." oninput="updateLink('${id}')">
            <div>
              <a id="${id}-link" class="activity-link disabled" href="#" target="_blank" rel="noopener noreferrer">🚀 Launch Activity ${a} ↗</a>
            </div>
          </div>
        `;
      }

      card.innerHTML = cardHTML;
      grid.appendChild(card);
    }

    // Convert input values into live hyperlinks
    function updateLink(id) {
      const input = document.getElementById(`${id}-input`);
      const link = document.getElementById(`${id}-link`);
      let val = input.value.trim();

      if (val !== "") {
        if (!val.startsWith("http://") && !val.startsWith("https://")) {
          val = "https://" + val;
        }
        link.href = val;
        link.classList.remove("disabled");
      } else {
        link.href = "#";
        link.classList.add("disabled");
      }
    }

    // Save inputs in browser local storage
    function saveData() {
      for (let u = 1; u <= totalUnits; u++) {
        for (let a = 1; a <= activitiesPerUnit; a++) {
          const id = `u${u}-a${a}`;
          const inputVal = document.getElementById(`${id}-input`).value;
          localStorage.setItem(`${id}-url`, inputVal);
        }
      }
      alert("All activity links saved locally!");
    }

    // Load saved links on page startup
    function loadData() {
      for (let u = 1; u <= totalUnits; u++) {
        for (let a = 1; a <= activitiesPerUnit; a++) {
          const id = `u${u}-a${a}`;
          const savedUrl = localStorage.getItem(`${id}-url`);

          if (savedUrl) {
            document.getElementById(`${id}-input`).value = savedUrl;
            updateLink(id);
          }
        }
      }
    }

    window.onload = loadData;
  </script>
</body>
</html>
