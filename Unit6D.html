<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Colonial Soldiers of World War II</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Stardos+Stencil:wght@400;700&family=Special+Elite&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1f1229;
    --plum: #2e1a3d;
    --purple: #4e2b6e;
    --lilac: #b79ccb;
    --paper: #ece4dc;
    --paper-edge: #d6cabd;
    --brass: #c8a24f;
    --text-on-dark: #efe7f4;
    --text-on-paper: #2a1d33;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --plum: #2a1738; --ink: #1a0f23; }
  }
  :root[data-theme="dark"] { --plum: #2a1738; --ink: #1a0f23; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }

  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--plum);
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.018) 0 2px, transparent 2px 7px),
      radial-gradient(ellipse at top, #4a2a63 0%, transparent 65%);
    color: var(--text-on-dark);
    font-family: "Libre Baskerville", Georgia, "Times New Roman", serif;
  }

  header {
    text-align: center;
    padding: 3rem 1.25rem 1.5rem;
    max-width: 60rem;
    margin: 0 auto;
  }
  .ribbon {
    display: flex;
    justify-content: center;
    gap: 0;
    margin: 0 auto 1.4rem;
    width: 9rem;
    height: 0.75rem;
  }
  .ribbon span { flex: 1; }
  .ribbon span:nth-child(1), .ribbon span:nth-child(5) { background: var(--purple); }
  .ribbon span:nth-child(2), .ribbon span:nth-child(4) { background: var(--brass); }
  .ribbon span:nth-child(3) { background: var(--lilac); flex: 2; }

  h1 {
    font-family: "Stardos Stencil", "Arial Black", Impact, sans-serif;
    font-weight: 700;
    font-size: clamp(2.2rem, 6vw, 4rem);
    line-height: 1.05;
    letter-spacing: 0.02em;
    margin: 0;
    color: var(--paper);
    text-shadow: 3px 3px 0 var(--ink);
  }
  .subtitle {
    font-family: "Stardos Stencil", "Arial Black", sans-serif;
    font-size: clamp(1rem, 2.4vw, 1.35rem);
    color: var(--brass);
    margin: 0.6rem 0 0;
    letter-spacing: 0.04em;
  }
  .directions {
    max-width: 38rem;
    margin: 1.5rem auto 0;
    font-size: 0.98rem;
    line-height: 1.7;
    color: var(--text-on-dark);
    opacity: 0.9;
  }

  main {
    max-width: 72rem;
    margin: 0 auto;
    padding: 1.5rem 1.25rem 4rem;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 2.2rem 1.6rem;
  }
  @media (max-width: 960px) { .board { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 600px) { .board { grid-template-columns: repeat(2, 1fr); gap: 1.6rem 1rem; } }

  .print {
    all: unset;
    display: block;
    cursor: pointer;
    background: var(--paper);
    padding: 0.6rem 0.6rem 0.9rem;
    box-shadow: 0 6px 14px rgba(10, 4, 16, 0.55);
    transform: rotate(var(--tilt, 0deg));
    transition: transform 0.18s ease;
    position: relative;
  }
  .print:hover { transform: rotate(0deg) scale(1.03); }
  .print:focus-visible { outline: 3px solid var(--brass); outline-offset: 4px; }
  .print .photo {
    aspect-ratio: 4 / 5;
    background: #3a2f3f;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .print img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(1) contrast(1.05) sepia(0.15);
    display: block;
  }
  .print .caption {
    font-family: "Special Elite", "Courier New", monospace;
    color: var(--text-on-paper);
    font-size: 0.92rem;
    text-align: center;
    margin-top: 0.6rem;
    line-height: 1.3;
  }
  .print .origin {
    display: block;
    font-size: 0.78rem;
    color: #6a5675;
    margin-top: 0.15rem;
  }
  .print.empty { cursor: default; opacity: 0.55; }
  .print.empty:hover { transform: rotate(var(--tilt, 0deg)); }
  .print.empty .photo {
    font-family: "Stardos Stencil", sans-serif;
    color: var(--lilac);
    font-size: 2.4rem;
  }

  /* Pop-up */
  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(18, 8, 26, 0.78);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1.25rem;
    padding-top: calc(1.25rem + env(safe-area-inset-top, 0px));
    padding-bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px));
    z-index: 10;
  }
  .backdrop.open { display: flex; }
  .record {
    background: var(--paper);
    color: var(--text-on-paper);
    max-width: 36rem;
    width: 100%;
    max-height: 100%;
    overflow-y: auto;
    border-top: 0.9rem solid var(--purple);
    box-shadow: 0 18px 40px rgba(0,0,0,0.6);
    position: relative;
    animation: drop 0.22s ease-out;
  }
  @keyframes drop { from { transform: translateY(-14px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .record { animation: none; }
    .print, .print:hover { transition: none; }
  }
  .record-inner {
    display: grid;
    grid-template-columns: 9rem 1fr;
    gap: 1.25rem;
    padding: 1.5rem;
  }
  @media (max-width: 520px) { .record-inner { grid-template-columns: 1fr; } .record-photo { max-width: 10rem; } }
  .record-photo {
    border: 0.4rem solid #fff;
    box-shadow: 0 3px 8px rgba(0,0,0,0.3);
    aspect-ratio: 4 / 5;
    overflow: hidden;
    background: #3a2f3f;
  }
  .record-photo img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) sepia(0.15); display: block; }
  .record-inner.wide { grid-template-columns: 1fr; }
  .record-inner.wide .record-photo { aspect-ratio: auto; max-width: none; }
  .record-inner.wide .record-photo img { height: auto; }
  .record h2 {
    font-family: "Stardos Stencil", "Arial Black", sans-serif;
    font-size: 1.7rem;
    line-height: 1.1;
    margin: 0;
    color: var(--purple);
  }
  .record .record-origin {
    font-family: "Special Elite", "Courier New", monospace;
    font-size: 0.92rem;
    margin: 0.35rem 0 0.9rem;
    padding-bottom: 0.7rem;
    border-bottom: 1px dashed var(--paper-edge);
    color: #5a4766;
  }
  .record p.summary {
    font-family: "Special Elite", "Courier New", monospace;
    font-size: 1.02rem;
    line-height: 1.75;
    margin: 0;
  }
  .record .note {
    font-family: "Libre Baskerville", Georgia, serif;
    font-style: italic;
    font-size: 0.85rem;
    color: #5a4766;
    margin: 0.9rem 0 0;
  }
  .close {
    position: absolute;
    top: 0.5rem;
    right: 0.6rem;
    background: none;
    border: none;
    font-family: "Stardos Stencil", sans-serif;
    font-size: 1.6rem;
    color: var(--purple);
    cursor: pointer;
    line-height: 1;
    padding: 0.25rem 0.45rem;
  }
  .close:focus-visible { outline: 2px solid var(--purple); }
</style>
</head>

<header>

  <h1>Colonial Soldiers of World War II</h1>

<main>

        <p class="summary" id="recSummary"></p>
        <p class="note" id="recNote" hidden></p>
      </div>
    </div>
  </div>
</div>

// ===== END SOLDIERS =====

const TILTS = [-2, 1.5, -1, 2, -1.5, 1, -2, 1.5, -1, 2];
const board = document.getElementById("board");
const backdrop = document.getElementById("backdrop");
let lastFocus = null;

SOLDIERS.forEach((s, i) => {
  const filled = s.name && s.img;
  const btn = document.createElement("button");
  btn.className = "print" + (filled ? "" : " empty");
  btn.style.setProperty("--tilt", TILTS[i] + "deg");
  if (filled) {
    btn.innerHTML =
      '<div class="photo"><img alt="Photograph of ' + s.name + '" src="' + s.img + '"></div>' +
      '<div class="caption">' + s.name + '<span class="origin">' + s.origin + '</span></div>';
    btn.addEventListener("click", () => openRecord(s));
  } else {
    btn.disabled = true;
    btn.innerHTML =
      '<div class="photo">' + (i + 1) + '</div>' +
      '<div class="caption">Coming soon</div>';
  }
  board.appendChild(btn);
});

function openRecord(s) {
  lastFocus = document.activeElement;
  document.getElementById("recPhoto").innerHTML = '<img alt="" src="' + s.img + '">';
  document.getElementById("recName").textContent = s.name;
  document.getElementById("recOrigin").textContent = s.origin;
  document.getElementById("recSummary").textContent = s.summary;
  document.querySelector(".record-inner").classList.toggle("wide", !!s.wide);
  const note = document.getElementById("recNote");
  note.textContent = s.note || "";
  note.hidden = !s.note;
  backdrop.classList.add("open");
  document.getElementById("closeBtn").focus();
}
function closeRecord() {
  backdrop.classList.remove("open");
  if (lastFocus) lastFocus.focus();
}
document.getElementById("closeBtn").addEventListener("click", closeRecord);
backdrop.addEventListener("click", e => { if (e.target === backdrop) closeRecord(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && backdrop.classList.contains("open")) closeRecord(); });
</script>
